# GoodJob's recurring jobs, read by `config.good_job.enable_cron`.
#
# The sweep is the net behind the notification, and not the main road — a
# notification can be lost, its dispatcher can be stopped, and a queue left
# unwatched is a message never delivered. It is idempotent by construction: the
# gateway erases a message once it has been retrieved.
#
# The purge carries out the second half of article 17: keep for twelve months,
# and do not keep beyond. Once a day is enough, the term being counted in
# months.
#
# The expiry runs to the minute, chapter 4.4 expressing its intervals in
# minutes: a coarser sweep would make the delay observed differ from the one
# configured.
default: &commun
  ramassage_messages_en_attente:
    cron: '*/2 * * * *'
    class: CollectPendingMessagesJob
    description: Récupère ce que la passerelle garde encore pour nous
  purge_journal_echanges:
    cron: '17 3 * * *'
    class: PurgeAuditEventsJob
    description: Efface du journal les échanges dont la durée de conservation est écoulée
  expiration_exchanges:
    cron: '* * * * *'
    class: ExpireExchangesJob
    description: Clôt les échanges qu'aucune réponse n'a réglés dans le délai imparti

development: *commun
test: {}
production: *commun
