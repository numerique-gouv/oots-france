fr:
  # `Exchange` est le seul modèle persisté dont une validation s'adresse à un
  # humain : ses traductions vivent sous `activerecord`, que Rails interroge
  # d'après le `i18n_scope` de la classe.
  # Sous `activemodel`, elles ne seraient jamais trouvées — la validation
  # échouerait bien, mais avec le message générique de Rails.
  activerecord:
    attributes:
      exchange:
        exchange_id: L'identifiant d'échange
        conversation_id: L'identifiant de conversation
        preview_location: L'adresse de prévisualisation
    errors:
      models:
        exchange:
          attributes:
            exchange_id:
              format: doit être un UUID
            conversation_id:
              format: doit être un UUID
            preview_location:
              format: doit être une adresse http ou https
  activemodel:
    # Les identifiants sont anglais, parce que c'est le vocabulaire des TDD ;
    # ce qui s'affiche ne l'est pas. Sans ces traductions, un message mêlerait
    # les deux langues — « Country doit être un code pays ».
    attributes:
      address:
        country: Le pays
      ebms_identity:
        id: L'identifiant
        type_id: Le schéma d'identifiant
      access_point:
        id: L'identifiant
        type_id: Le schéma d'identifiant
      natural_person:
        level_of_assurance: Le niveau de garantie
        family_name: Le nom
        given_name: Le prénom
        date_of_birth: La date de naissance
        place_of_birth: Le lieu de naissance
        gender: Le sexe
      legal_person:
        legal_name: La raison sociale
        eidas_identifier: L'identifiant eIDAS
      evidence_type:
        id: L'identifiant
        distribution_formats: Les formats de distribution
      requirement:
        id: L'identifiant
      data_service:
        id: L'identifiant
        evidence_type_classification: Le type de justificatif
        distribution_format: Le format de distribution
        distribution_language: La langue de distribution
        distribution_conforms_to: Le modèle de données de la distribution
      evidence_requester:
        id: L'identifiant
      evidence_provider:
        access_point: Le point d'accès
      resolution_filter:
        procedure_code: La démarche
        country_code: Le pays
        requirement_id: L'exigence
        evidence_type_id: Le type de justificatif
      audit_event_filter:
        event_type: Le type d'événement
        exchange_id: L'identifiant d'échange
        conversation_id: L'identifiant de conversation
        country_code: Le pays
        evidence_requester_id: Le requêteur
        procedure_code: La démarche
        depuis: La date de début
        jusqu_a: La date de fin
      subject_search:
        family_name: Le nom d'usage
        given_name: Le prénom
        date_of_birth: La date de naissance
        legal_person_identifier: L'identifiant eIDAS de la personne morale
      # L'identité que la démarche de démonstration tient de FranceConnect+.
      # Nommée dans le vocabulaire du portail, qui est celui de ses claims :
      # `birthdate`, et non la `date_of_birth` de la requête.
      demo/user_identity:
        given_name: Le prénom
        family_name: Le nom
        birthdate: La date de naissance
        eidas_identifier: L'identifiant eIDAS
        level_of_assurance: Le niveau de garantie
        gender: Le sexe
        place_of_birth: Le lieu de naissance
        subject: L'identifiant FranceConnect+
        id_token: L'ID Token
    errors:
      models:
        address:
          attributes:
            country:
              format: doit être un code pays à deux lettres
        natural_person:
          attributes:
            date_of_birth:
              format: doit être une date ISO 8601 (AAAA-MM-JJ)
            eidas_identifier:
              format: doit être de la forme PAYS/PAYS/IDENTIFIANT
            # `%{admitted}` est la liste de codes elle-même, passée en option de
            # la validation : la traduction dirait sinon une liste que rien ne
            # tient en phase avec celle que le modèle compare.
            level_of_assurance:
              inclusion: "vaut « %{value} », alors que les TDD n'admettent que %{admitted}"
            gender:
              inclusion: "vaut « %{value} », alors que les TDD n'admettent que %{admitted}"
            place_of_birth:
              too_short: doit porter au moins deux caractères une fois les blancs réduits
        legal_person:
          attributes:
            eidas_identifier:
              format: doit être de la forme PAYS/PAYS/IDENTIFIANT
          unpublished_identifier_scheme: "un identifiant relève d'un schéma que les TDD ne publient pas : %{schemes}"
          valueless_identifier: "un identifiant est déclaré sans valeur : %{schemes}"
        requirement:
          attributes:
            id:
              format: doit être une URL du dépôt sémantique terminée par un UUID
          # Invariable, faute de savoir laquelle des formulations est en cause.
          unlabelled_wording: une formulation ne nomme pas sa langue
        data_service:
          attributes:
            id:
              format: doit être un UUID
            evidence_type_classification:
              format: doit être une URL du dépôt sémantique terminée par un UUID
            distribution_language:
              format: doit être un code langue de deux lettres majuscules
            distribution_conforms_to:
              format: doit être une URL du dépôt sémantique sous « datamodels/ »
          unlabelled_wording: une formulation ne nomme pas sa langue
        resolution_filter:
          attributes:
            country_code:
              format: doit être un code pays à deux lettres
          # Invariable, faute de savoir le genre de l'attribut qui le portera.
          unreadable: est illisible
        audit_event_filter:
          attributes:
            event_type:
              inclusion: n'est pas un type d'événement connu
            country_code:
              format: doit être un code pays à deux lettres
            jusqu_a:
              before_start: est antérieure à la date de début
          unreadable: est illisible
        subject_search:
          attributes:
            date_of_birth:
              format: doit être une date ISO 8601 (AAAA-MM-JJ)
          unreadable: est illisible
          # Les deux formulaires de la page rendent le cas impossible à la
          # souris ; une adresse forgée, elle, peut porter les deux identités,
          # et en honorer une seule répondrait à une question que personne n'a
          # posée.
          both_identities: >-
            Une recherche porte sur une personne physique ou sur une personne morale,
            jamais sur les deux à la fois
        demo/user_identity:
          attributes:
            birthdate:
              format: doit être une date ISO 8601 (AAAA-MM-JJ)
            # `R-EDM-REQ-C040` (FATAL) : porté tel quel dans la requête, un
            # identifiant hors de cette forme la ferait refuser. Le message
            # nomme la forme plutôt que la règle, l'exploitant n'ayant pas le
            # Schematron sous les yeux.
            eidas_identifier:
              format: doit être de la forme PAYS/PAYS/IDENTIFIANT
            level_of_assurance:
              inclusion: "vaut « %{value} », alors que les TDD n'admettent que %{admitted}"
            gender:
              inclusion: "vaut « %{value} », alors que FranceConnect+ n'en publie que %{admitted}"
  accueil:
    index:
      lead: >-
        Ce service échange des justificatifs avec les autres États membres de l'Union européenne,
        pour le compte des démarches administratives françaises. Il s'adresse à des systèmes,
        non à des usagers : une personne qui cherche à faire venir un justificatif passe par le
        portail de la démarche.
      open_admin: Ouvrir l’espace d’administration
  # Les deux pages où FranceConnect+ renvoie l'usager de la démarche de
  # démonstration. Elles répondent sans session : `docs/eidas_context.md` dit
  # pourquoi ces adresses existent avant la cinématique qui y mène.
  france_connect:
    retour_deconnexion:
      title: Vous êtes déconnecté
      lead: >-
        Votre session FranceConnect+ est close, et la démarche de démonstration ne tient plus
        aucune identité. Recommencer demande de s'identifier à nouveau.
      # Le `state` ne correspond pas : la page répond quand même, FranceConnect+
      # exigeant qu'une adresse déclarée réponde, mais elle n'atteste rien.
      unexpected: >-
        Cette page est celle où FranceConnect+ ramène l'usager après une déconnexion, et cette
        arrivée-ci ne correspond à aucune déconnexion demandée depuis ce navigateur : elle
        n'atteste donc rien.
      back: Revenir à la démarche de démonstration
  layouts:
    application:
      # Le nom du service, que le titre de l'onglet, le bloc service de l'entête
      # et la page d'accueil disent tous les trois.
      name: OOTS-France
      skiplink: Accès rapide
      skiplink_content: Contenu
    # Le bloc-marque du DSFR se lit sur deux lignes, la seconde après un saut.
    # L'entête et le pied de page le disent tous les deux.
    logo_html: République<br>Française
    entete:
      tagline: Échange transfrontalier de justificatifs
      demo: Démo
      directories: Annuaires
      jobs: Jobs
      journal: Journal
      sign_out: Se déconnecter
    pied_de_page:
      # L'adresse du lien reste dans le gabarit : `fr.yml` n'a pas à devenir
      # l'endroit où l'on va corriger un lien mort.
      about_html: OOTS-France met en œuvre le %{tdd} du règlement européen sur le portail numérique unique.
      tdd: système technique « une fois pour toutes »
  components:
    admin_breadcrumbs:
      admin: Espace d’administration
    # Ce que le cadenas ouvert signifie, écrit hors écran parce qu'une icône
    # seule ne le dit qu'à l'œil, et repris en infobulle pour qui la survole.
    # Le bouton qui déplie le corps RegRep d'un événement : il en annonce la
    # taille, un document de métadonnées faisant plusieurs kilo-octets.
    regrep_body:
      summary: Afficher le corps (%{size})
    decrypted_value:
      label: Donnée personnelle déchiffrée
    # La pastille que porte l'identifiant d'un échange conduit en 1.2 : la
    # France se l'est attribué à l'ouverture et ne l'a émis dans aucun message.
    # Le sens dit ce que « Factice » seul laisserait croire — l'échange, lui, a
    # bien eu lieu.
    minted_identifier:
      label: Factice
      meaning: "Attribué par la France pour un échange en 1.2 : il ne figure dans aucun message."
    # Ce que le lecteur voit là où le contenu n'arrivera pas : sans JavaScript,
    # rien ne va le chercher, et l'échec réseau ne laisse rien à afficher. Ce
    # que la page attend, en revanche, est dit par la page — elle seule sait ce
    # qu'elle charge.
    deferred_content:
      no_script: Cette page charge son contenu en JavaScript, et celui-ci est désactivé.
      failed: Le contenu de cette page n'a pas pu être chargé. Rechargez la page pour réessayer.
    directory_breadcrumbs:
      directories: Annuaires centraux
    directory_query:
      section: Requête effectuée
      identifiers_title: Identifiants
      # Nommés à l'appel par un symbole : quatre gabarits les affichent, et un
      # cinquième ne doit pas pouvoir inventer un cinquième intitulé.
      identifiers:
        requirement: Exigence
        evidence_type: Type de justificatif
    edm_error_code:
      chapter: Chapitre 4.5.3 des TDD, qui définit les huit codes (nouvelle fenêtre)
      # Les huit codes de la liste publiée avec les TDD, glosés pour un
      # exploitant. Le libellé que porte le message, lui, reste dans
      # `EdmException#message` : c'est celui qui part sur le fil, mot pour mot.
      codes:
        "EDM:ERR:0001": Authentification échouée
        "EDM:ERR:0002": Autorisation manquante
        "EDM:ERR:0003": Requête syntaxiquement ou sémantiquement invalide
        "EDM:ERR:0004": Objet introuvable
        "EDM:ERR:0005": Délai d'expiration dépassé
        "EDM:ERR:0006": Objet référencé impossible à résoudre
        "EDM:ERR:0007": Fonction ou capacité facultative non prise en charge
        "EDM:ERR:0008": Requête dont la syntaxe ou la sémantique doit être corrigée
    # Le Schematron plutôt que le chapitre, qui porte la règle lui aussi : le
    # premier est épinglé sur une étiquette de version, le second est une page
    # vivante.
    tdd_rule:
      schematron: Cette règle des TDD, telle que le Schematron l'écrit (nouvelle fenêtre)
    pagination:
      previous: Page précédente
      next: Page suivante
      page: Page %{number}
    # Le sujet du justificatif relu champ par champ sur la fiche d'événement.
    # Les intitulés sont cherchés par une clé composée du nom du champ, avec
    # repli sur ce nom : un attribut que le chapitre 4.5.1 autorise et que
    # `NaturalPerson` ou `LegalPerson` gagnera reste lisible avant d'être
    # nommé ici. Le repli sert aussi ce qui ne se traduit pas — les schémas
    # d'identifiant `VAT`, `LEI`, `EORI` sont les valeurs que
    # `R-EDM-REQ-C055` compare mot pour mot, et le journal montre ce qui a
    # circulé.
    evidence_subject:
      fields:
        level_of_assurance: Niveau de garantie
        eidas_identifier: Identifiant eIDAS
        family_name: Nom
        given_name: Prénom
        date_of_birth: Date de naissance
        place_of_birth: Lieu de naissance
        gender: Sexe
        legal_name: Raison sociale
        identifiers: Identifiants
  builders:
    evidence_request_builder:
      unknown_subject: "Sujet de justificatif d'un type que la requête ne sait pas écrire : « %{type} »."
    evidence_subject_builder:
      unknown_subject: "Sujet de justificatif d'un type que la réponse ne sait pas écrire : « %{type} »."
  clients:
    common_services_instance:
      dns_failure: "Résolution DNS impossible pour « %{name} » : %{error}."
    common_services_query:
      unreachable: "Annuaire injoignable (%{url}) : %{error}."
      not_cached: "Réponse d'annuaire non mise en cache (%{url}) : %{error}"
    code_list:
      nothing_read: "Liste de codes lue sans y rien trouver (%{list}) : structure inattendue ?"
    common_services_signature:
      invalid: Signature invalide sur la réponse de l'annuaire.
      digest_mismatch: L'empreinte annoncée ne couvre pas la réponse de l'annuaire.
      not_http_headers: Signature de l'annuaire non conforme au mécanisme HttpHeaders.
      no_certificate: La réponse de l'annuaire ne porte aucun certificat.
      certificate_rejected: "Certificat de l'annuaire rejeté par le magasin de confiance : %{error}."
      header_unreadable: En-tête de signature illisible sur la réponse de l'annuaire.
      header_unreadable_detail: "En-tête de signature illisible sur la réponse de l'annuaire : %{error}."
      certificate_unreadable: "Certificat illisible dans la réponse de l'annuaire : %{error}."
    # Ce que la démarche de démonstration dit d'une frontière qui n'a pas
    # répondu ce qu'il fallait. Les deux premières deviennent le message de
    # l'erreur levée, que l'échec structuré porte jusque sous l'alerte de
    # l'usager ; la troisième ne va qu'aux logs, la requête se poursuivant sur
    # un corps vide.
    demo:
      beneficiary_token_writer:
        no_key: "Le jeu de clés publié en %{url} ne porte aucune clé : le jeton du bénéficiaire ne peut être chiffré pour personne."
        unreadable: "Jeu de clés illisible en %{url} : %{error}"
      # Posée sur la réponse et non sur l'un des deux clients : les deux appellent
      # le même contrat, et un corps qui n'est pas un objet JSON est la même
      # non-réponse pour l'un comme pour l'autre.
      contract_answer:
        unreadable: "Réponse illisible de %{path} (%{status}) : %{error}"
      exchange_state_client:
        unreachable: "Le contrat n'a pas répondu : %{error}"
    beneficiary_token:
      gender: "Sexe « %{value} » refusé : le jeton du bénéficiaire n'en porte que %{admitted}."
      invalid: "Jeton bénéficiaire invalide : %{error}"
      unexpected_algorithms: Jeton bénéficiaire chiffré en %{announced}, attendu %{expected}.
    # Deux refus posés sur le document de découverte : ce dépôt appelle
    # l'*issuer* qu'on lui a configuré, et rien d'autre.
    france_connect_client:
      foreign_issuer: "Le document de découverte annonce l'issuer « %{announced} », et non %{expected}."
      foreign_endpoint: "FranceConnect+ publierait %{name} sur « %{url} », hors de %{expected} : appel refusé."
      missing_endpoint: "Le document de découverte de FranceConnect+ ne publie aucun %{name}."
      unreadable_endpoint: "FranceConnect+ publie un %{name} qui n'est pas une adresse : %{error}"
      unreadable_discovery: "Le document de découverte de FranceConnect+ ne se lit pas comme du JSON : %{error}"
      unreadable_grant: "Réponse illisible de /token : %{error}"
      incomplete_grant: "La réponse de /token ne porte pas %{names}."
    # La question posée une fois de tout ce que le portail répond : chacun de ses
    # documents est un objet JSON, et un corps qui n'en est pas se refuse avant
    # qu'on l'indexe.
    france_connect_answer:
      not_an_object: "%{subject} : le corps est un %{type}, là où FranceConnect+ publie un objet."
      subjects:
        discovery: Document de découverte de FranceConnect+
        grant: Réponse de /token
        claims: Jeton FranceConnect+
        sealed_header: En-tête du jeton scellé
    # Ce que FranceConnect+ scelle pour la démarche : l'ID Token et la réponse
    # UserInfo, signés puis chiffrés. Les trois refus disent lequel des deux
    # sceaux a cédé.
    france_connect_token:
      unreadable: "Jeton FranceConnect+ indéchiffrable : %{error}"
      invalid: "Signature FranceConnect+ invalide : %{error}"
      unexpected_algorithms: Jeton FranceConnect+ chiffré en %{announced}, attendu %{expected}.
  gateways:
    directories:
      # Le refus relayé par le balayage du catalogue, qui pose la même question
      # cinquante-trois fois : sans l'exigence, la page rendrait le refus
      # d'aucune d'entre elles en particulier.
      catalogue:
        swept: "%{error} (exigence %{requirement})"
      common_services:
        no_evidence_type: Aucun type de justificatif pour la démarche « %{procedure} » dans le pays « %{country} »
        no_provider: Aucun fournisseur pour le type de justificatif « %{evidence_type} » dans le pays « %{country} »
        unknown_procedure: Code de démarche « %{procedure} » introuvable
      evidence_requesters:
        unknown: Le requêteur avec comme identifiant « %{id} » est inexistant.
  jobs:
    expire_exchanges_job:
      failed: "Expiration impossible pour l'échange %{id} : %{error}"
  lib:
    audit_trail:
      unreadable_field: "Champ « %{field} » illisible, absent de la ligne de journal : %{error}"
      unhandled_action: "Aucun traitement pour l'action ebMS « %{action} »"
    public_key_set:
      unknown_key_type: "Type de clé inconnu : « %{type} »."
    settings:
      # Les deux couples que FranceConnect+ accepte pour chiffrer l'ID Token et
      # la réponse UserInfo. Le refus nomme ce que la clé déclare : c'est la
      # seule chose que l'exploitant ait à corriger.
      france_connect_algorithm: "La clé de la démarche déclare l'algorithme « %{algorithm} » : FranceConnect+ n'accepte que %{expected}."
      france_connect_algorithm_absent: "La clé de la démarche ne déclare aucun algorithme : FranceConnect+ n'accepte que %{expected}, et une clé JWK n'en porte un que si on l'y écrit."
      france_connect_key_unreadable: "CLE_PRIVEE_JWK_DEMARCHE_EN_BASE64 ne se décode pas en une clé JWK : la valeur attendue est un objet JSON encodé en base64."
      demo_signing_key_unreadable: "CLE_PRIVEE_JWK_SIGNATURE_DEMARCHE_EN_BASE64 ne se décode pas en une clé JWK : la valeur attendue est un objet JSON encodé en base64."
      # Le jeton du bénéficiaire ne se signe qu'en ES256, et ES256 n'existe que
      # sur P-256 : une clé d'un autre type échouerait à la première signature,
      # loin d'ici.
      demo_signing_curve: "CLE_PRIVEE_JWK_SIGNATURE_DEMARCHE_EN_BASE64 déclare une clé %{kty} sur %{crv} : le jeton du bénéficiaire se signe en ES256, qui exige une clé EC sur P-256."
      unnamed_member: sans valeur
      missing: "Variables d'environnement obligatoires absentes ou vides : %{names}."
      not_boolean: "%{name} vaut « %{value} » : cette variable commande un dispositif, elle ne peut valoir que true, false, ou rien du tout."
      not_whole: "Variables d'environnement devant être des nombres entiers positifs : %{names}."
      not_whole_entry: "%{name} (« %{value} »)"
      required: La variable d'environnement %{name} est obligatoire et ne peut pas être vide.
      retention_below_floor: "DUREE_RETENTION_JOURNAL_MOIS vaut %{months} : l'article 17(4) du règlement d'exécution (UE) 2022/1463 impose d'en conserver %{floor} au minimum."
      timeouts_out_of_order: "DELAI_EXPIRATION_REQUETEUR_MINUTES vaut %{requester} et DELAI_EXPIRATION_FOURNISSEUR_MINUTES %{provider} : le chapitre 4.4 des TDD impose que le délai d'attente d'une réponse dépasse celui qu'on s'accorde pour en produire une, transport compris."
  parsers:
    # Dits par plusieurs lecteurs, d'où leur place au-dessus d'eux.
    not_a_query_response: Le message reçu n'est pas une QueryResponse.
    plugin_unreadable: Réponse du plugin illisible.
    slot_reading:
      in_received_message: "%{description} dans le message reçu."
      missing: Slot « %{name} » absent du message reçu.
      empty: Le slot « %{name} » est vide
      without: Le slot « %{name} » ne porte pas %{path}
    evidence_request:
      not_a_query_request: Le message reçu n'est pas une QueryRequest.
      # Les règles du chapitre 4.6 que la France tranche avant de répondre.
      slot_required: La requête reçue doit porter exactement un slot « %{name} ».
      unexpected_specification: La requête reçue annonce %{announced}, et non %{expected}.
      unnamed_specification: une version sans nom
      evidence_subject_not_alone: >-
        La requête reçue doit décrire soit une personne physique, soit une
        personne morale, et une seule (%{count} déclarée(s)).
      # R-EDM-REQ-S004 : l'identifiant est refusé à la lecture, faute de quoi la
      # France le réémettrait dans une réponse qui enfreindrait R-EDM-RESP-S004
      # ou R-EDM-ERR-S004.
      request_id_not_a_uuid: >-
        L'identifiant de la requête reçue (%{id}) n'est pas un UUID préfixé
        « urn:uuid: ».
      unnamed_request_id: absent
      no_query: Pas de query:Query dans le message reçu.
      # R-EDM-REQ-S039 : la collection EvidenceRequester porte au moins un
      # rim:Element qui porte un sdg:Agent. C'est l'assertion —
      # « rim:Element/sdg:Agent » sur le rim:SlotValue — et non son message, qui
      # dit que chaque rim:Element « MUST use » un agent : un élément sans agent
      # à côté d'un élément qui en porte un satisfait la règle. Ce refus-là ne
      # repart pas — sans agent, ni valeur à recopier ni finalRecipient à
      # adresser —, et il précède C074, qui compterait sinon les classifications
      # d'agents qui n'existent pas.
      collection_without_agent: >-
        La collection « EvidenceRequester » de la requête reçue ne porte aucun agent.
      # R-EDM-REQ-C074 : la collection EvidenceRequester compte exactement un
      # agent classé ER. La phrase compte, elle ne constate pas une absence :
      # zéro et deux enfreignent la même règle. Comparé brut, comme
      # l'assertion — un agent classé « ER » entouré de blancs ne compte pas
      # ici, et c'est C014 qui le refuse, avec réponse.
      requester_agent_not_alone: >-
        La requête reçue doit porter exactement un agent classé ER (%{count} déclaré(s)).
      # Le chapitre 4.5.1 §3.2, qu'aucune assertion ne double : le contexte de
      # C011 est l'identifiant lui-même, donc l'élément absent n'enfreint rien.
      agent_without_identifier: L'agent classé ER est sans identifiant.
      # L'identifiant présent et vide, que rien ne nomme non plus : C012 mesure
      # une longueur qu'aucune valeur n'a trop courte.
      agent_without_id: L'identifiant de l'agent classé ER est vide
      evidence_type_without_id: Le type de justificatif est sans identifiant
      # R-EDM-REQ-C032 : le type de justificatif demandé porte au moins une
      # distribution ; une requête qui n'en demande aucune est invalide, et non
      # pas exigeante — d'où EDM:ERR:0003 et non EDM:ERR:0007.
      evidence_type_without_distribution: >-
        La requête reçue doit demander au moins une distribution du type de
        justificatif.
      # R-EDM-REQ-C054 : un identifiant facultatif de la personne morale nomme
      # son schéma ; sans lui, il ne désigne rien.
      legal_identifier_without_scheme: Un identifiant de la personne morale est sans schéma
      # R-EDM-REQ-C011, C012, C092, C108 et C109 : ce que la réponse d'erreur
      # recopierait de l'agent requêteur. Ces refus-là ne partent pas au
      # correspondant — l'exception enfreindrait R-EDM-ERR-C009, C010, C027,
      # C028 ou C029 —, et le journal est le seul endroit où ils se relisent.
      agent_without_scheme: >-
        L'identifiant de l'agent classé ER ne porte pas d'attribut « schemeID ».
      agent_scheme_unknown: >-
        Le schéma d'identifiant de l'agent classé ER (« %{scheme} ») n'est ni un code de la liste
        EAS, ni un code pays d'OOTS.
      agent_id_too_long: >-
        L'identifiant de l'agent classé ER fait %{length} caractères, au-delà des %{maximum} admis.
      agent_without_name: L'agent classé ER est sans nom
      agent_name_too_short: Le nom de l'agent classé ER (« %{name} ») fait moins de deux caractères
      agent_without_language: Le nom de l'agent classé ER ne porte pas d'attribut « lang »
      agent_language_unknown: >-
        La langue du nom de l'agent classé ER (« %{language} ») n'est pas un code de la liste
        LanguageCode.
      # R-EDM-REQ-C073 et C015 : le pays de l'agent requêteur. Repartent, eux, en
      # EDM:ERR:0003 — la réponse d'erreur ne porte aucune adresse du requêteur.
      agent_without_country: >-
        L'agent classé ER doit déclarer exactement un pays dans sdg:Address/sdg:AdminUnitLevel1.
      agent_country_unknown: >-
        Le pays de l'agent classé ER (« %{country} ») n'est pas un code de la liste
        CountryIdentificationCode.
      # R-EDM-REQ-C016 : le territoire, sous le pays. Aucune règle ne l'exige —
      # le contexte de l'assertion est l'élément lui-même —, et chaque agent de
      # la collection EvidenceRequester est jugé, le requêteur compris.
      agent_territory_unknown: >-
        Le territoire de l'agent classé ER (« %{territory} ») n'est pas un code de la liste NUTS.
      # R-EDM-REQ-C013, C014, C011, C012, C092, C109, C108 et C015 sur les agents
      # de la collection EvidenceRequester que le requêteur n'est pas — la
      # plateforme intermédiaire du pays qui demande, en pratique. Ceux-là
      # repartent en EDM:ERR:0003 : une réponse d'erreur ne nomme que le
      # requêteur, donc rien de l'agent refusé ne voyagerait dans le message qui
      # le refuse. Le français dit « l'agent qui accompagne le requêteur » tant
      # que C014 n'a pas tranché, « la plateforme intermédiaire » ensuite.
      platform_without_classification: >-
        L'agent qui accompagne le requêteur ne porte pas de classification.
      platform_classification_unexpected: >-
        L'agent qui accompagne le requêteur est classé « %{classification} », et non ER ou IP.
      platform_without_identifier: La plateforme intermédiaire est sans identifiant.
      platform_without_scheme: >-
        L'identifiant de la plateforme intermédiaire ne porte pas d'attribut « schemeID ».
      platform_scheme_unknown: >-
        Le schéma d'identifiant de la plateforme intermédiaire (« %{scheme} ») n'est ni un code de
        la liste EAS, ni un code pays d'OOTS.
      platform_id_too_long: >-
        L'identifiant de la plateforme intermédiaire fait %{length} caractères, au-delà des
        %{maximum} admis.
      platform_without_name: La plateforme intermédiaire est sans nom.
      platform_name_too_short: >-
        Le nom de la plateforme intermédiaire (« %{name} ») fait moins de deux caractères.
      platform_without_language: >-
        Un nom de la plateforme intermédiaire ne porte pas d'attribut « lang ».
      platform_language_unknown: >-
        La langue d'un nom de la plateforme intermédiaire (« %{language} ») n'est pas un code de la
        liste LanguageCode.
      platform_country_unknown: >-
        Le pays de la plateforme intermédiaire (« %{country} ») n'est pas un code de la liste
        CountryIdentificationCode.
      platform_territory_unknown: >-
        Le territoire de la plateforme intermédiaire (« %{territory} ») n'est pas un code de la
        liste NUTS.
      # R-EDM-REQ-S040 : la liste fermée des enfants de chaque agent de la
      # collection EvidenceRequester, le requêteur compris — son contexte ne
      # porte aucune condition de classification. L'assertion laisse libre le
      # nombre de chacun des quatre et refuse tout autre élément, un
      # sdg:ReferenceFramework ou un sdg:EvidenceTypeList compris ; l'espace de
      # noms est décidé par son URI et jamais par le préfixe. Une phrase pour les
      # deux agents, la règle ne les distinguant pas. Ce refus repart en
      # EDM:ERR:0003 : une réponse d'erreur ne recopie du requêteur que son
      # identifiant, son schéma et ses noms.
      collection_agent_unexpected_children: >-
        Un agent de la collection « EvidenceRequester » ne peut porter que sdg:Identifier,
        sdg:Name, sdg:Address et sdg:Classification (reçu en plus : %{children}).
      # R-EDM-REQ-S042, C017, C018, C110 et C111 sur les agents que porte le slot
      # EvidenceProvider — le premier étant le fournisseur que la requête
      # désigne. Les quatre dernières sont, mot pour mot, les assertions C011,
      # C012, C109 et C108 de la collection EvidenceRequester, publiées sous
      # d'autres identifiants parce que c'est le slot qui les fixe, et non la
      # classification ; S042, elle, est propre à ce slot, qui porte l'agent
      # directement là où la collection l'enveloppe d'un rim:Element. Ceux-là
      # repartent tous en EDM:ERR:0003 : la réponse d'erreur nomme la France
      # comme fournisseur, jamais celui qui a été reçu, donc rien de ce qui est
      # refusé ici ne voyagerait dans le message qui le refuse.
      provider_without_agent: >-
        Le slot « EvidenceProvider » de la requête reçue ne porte pas d'agent.
      # Aucune assertion ne couvre ces deux absences : C017 a pour contexte
      # sdg:Identifier, C111 sdg:Name, et C110 l'attribut lang de ce nom — aucune
      # ne se déclenche sur l'élément qui manque. C'est le chapitre 4.5.1 §3.3,
      # et AgentType avec lui, qui les impose.
      provider_without_identifier: Le fournisseur désigné est sans identifiant.
      provider_without_scheme: >-
        L'identifiant du fournisseur désigné ne porte pas d'attribut « schemeID ».
      provider_scheme_unknown: >-
        Le schéma d'identifiant du fournisseur désigné (« %{scheme} ») n'est ni un code de la
        liste EAS, ni un code pays d'OOTS.
      provider_id_too_long: >-
        L'identifiant du fournisseur désigné fait %{length} caractères, au-delà des
        %{maximum} admis.
      provider_without_name: Le fournisseur désigné est sans nom.
      # R-EDM-REQ-C092 sur ce nom-là : son contexte ne porte aucun ancêtre, donc
      # la règle l'atteint comme elle atteint les noms de la collection
      # EvidenceRequester. La phrase lui est propre plutôt que celle de la marche
      # transverse, pour qu'un opérateur qui lit le journal sache de quel agent
      # il s'agit.
      provider_name_too_short: >-
        Le nom du fournisseur désigné (« %{name} ») fait moins de deux caractères.
      provider_without_language: >-
        Un nom du fournisseur désigné ne porte pas d'attribut « lang ».
      provider_language_unknown: >-
        La langue d'un nom du fournisseur désigné (« %{language} ») n'est pas un code de la
        liste LanguageCode.
      # R-EDM-REQ-S043 : la liste fermée des enfants de l'agent que porte le slot
      # EvidenceProvider. L'assertion laisse libre le nombre de chacun — deux
      # noms la satisfont — et refuse tout autre élément, une adresse ou une
      # classification comprises. Chaque agent du rim:SlotValue est jugé, la
      # règle n'en comptant aucun.
      provider_unexpected_children: >-
        Le fournisseur désigné ne peut porter que sdg:Identifier et sdg:Name (reçu en plus :
        %{children}).
      # Les mêmes C017, C018, C111 et C110 sur les agents du slot que la requête
      # ne désigne pas : aucun de leurs contextes ne porte de prédicat de
      # position, donc chaque agent du rim:SlotValue les enfreint comme le
      # premier. Une phrase à eux, parce qu'un second agent n'est pas « le
      # fournisseur désigné » et qu'un refus qui le dirait nommerait le mauvais.
      # Rien n'est exigé de leur présence : ni assertion ni chapitre 4.5.1 §3.3,
      # qui décrit l'agent que le slot désigne, ne parle d'un second agent sans
      # identifiant ni sans nom.
      accompanying_provider_without_scheme: >-
        L'identifiant d'un fournisseur que la requête ne désigne pas ne porte pas d'attribut
        « schemeID ».
      accompanying_provider_scheme_unknown: >-
        Le schéma d'identifiant d'un fournisseur que la requête ne désigne pas (« %{scheme} »)
        n'est ni un code de la liste EAS, ni un code pays d'OOTS.
      accompanying_provider_id_too_long: >-
        L'identifiant d'un fournisseur que la requête ne désigne pas fait %{length} caractères,
        au-delà des %{maximum} admis.
      accompanying_provider_without_language: >-
        Un nom d'un fournisseur que la requête ne désigne pas ne porte pas d'attribut « lang ».
      accompanying_provider_language_unknown: >-
        La langue d'un nom d'un fournisseur que la requête ne désigne pas (« %{language} ») n'est
        pas un code de la liste LanguageCode.
      # R-EDM-REQ-C041 et C042 : l'identifiant du bénéficiaire, quand la requête
      # en porte un.
      beneficiary_identifier_without_scheme: >-
        L'identifiant du bénéficiaire est sans attribut « schemeID ».
      beneficiary_scheme_unexpected: >-
        L'identifiant du bénéficiaire est sous le schéma « %{scheme} », et non « %{expected} ».
      # R-EDM-REQ-C008, C010, C009, C094 et C093 : les exigences que la requête
      # invoque. Aucune règle ne les compte, et aucune ne dit rien d'une exigence
      # sans identifiant : leurs contextes sont l'identifiant, le nom, la
      # description et l'attribut « lang » de ces deux derniers — absents, ils
      # ne déclenchent aucune assertion. Ces refus-là repartent en
      # EDM:ERR:0003 : une réponse d'erreur ne recopie aucune exigence.
      element_without_requirement: >-
        Un élément du slot « Requirements » de la requête reçue ne porte pas de sdg:Requirement.
      requirement_id_unexpected: >-
        L'identifiant d'une exigence de la requête reçue (« %{id} ») n'est pas une URL du dépôt
        sémantique terminée par un UUID.
      unnamed_requirement_id: vide
      requirement_name_without_language: >-
        Le nom d'une exigence de la requête reçue ne porte pas d'attribut « lang ».
      requirement_name_language_unknown: >-
        La langue du nom d'une exigence de la requête reçue (« %{language} ») n'est pas un code de
        la liste LanguageCode.
      requirement_description_without_language: >-
        La description d'une exigence de la requête reçue ne porte pas d'attribut « lang ».
      requirement_description_language_unknown: >-
        La langue de la description d'une exigence de la requête reçue (« %{language} ») n'est pas
        un code de la liste LanguageCode.
      # R-EDM-REQ-S038 : la liste fermée des enfants d'une exigence. C'est le
      # test qui fait foi, et non son message : celui-ci dit que l'exigence
      # « MUST contain » les trois éléments, là où l'assertion n'en exige aucun
      # — une exigence à identifiant et nom, sans description, la satisfait, et
      # c'est ce que portent les deux requêtes réelles de la suite.
      requirement_unexpected_children: >-
        Une exigence de la requête reçue ne peut porter que sdg:Identifier, sdg:Name et
        sdg:Description (reçu en plus : %{children}).
      # Les dix-sept règles FATAL du slot EvidenceProviderClassification : S041
      # sur chaque rim:Element de la collection, et seize sur chaque
      # classification qu'il porte — son identifiant (C019) et le schéma que
      # celui-ci nomme (C097, C098, C099), son type (C020, C095), la valeur
      # retenue (C023, C105, C103, C104), ce que le type « codelist » ajoute
      # (C096, C100, C101) et la langue de chaque description (C022, C021). Le
      # slot, lui, n'est pas exigé — S014 le compte sous CAUTION —, donc son
      # absence n'est refusée nulle part. Ces refus-là repartent en
      # EDM:ERR:0003 : une réponse d'erreur ne recopie aucune classification.
      #
      # C102 n'est jamais nommée : son assertion est mot pour mot celle de C023,
      # sous un contexte plus étroit, donc ce qu'elle refuse C023 le refuse déjà.
      element_without_classification: >-
        Un élément du slot « EvidenceProviderClassification » de la requête reçue ne porte pas de
        sdg:EvidenceProviderClassification.
      classification_id_not_a_uuid: >-
        L'identifiant d'une classification de fournisseur (« %{id} ») n'est pas un UUID.
      unnamed_classification_id: vide
      classification_scheme_unexpected: >-
        Le schéma d'identifiant d'une classification de fournisseur (« %{scheme} ») n'est pas une
        URL de liste de codes du dépôt sémantique.
      classification_country_unknown: >-
        Le schéma d'identifiant d'une classification de fournisseur (« %{scheme} ») ne nomme pas un
        pays participant à OOTS.
      classification_scheme_name_unexpected: >-
        Le nom court du schéma d'identifiant d'une classification de fournisseur (« %{scheme} »)
        porte autre chose que des lettres et des chiffres.
      classification_without_type: Une classification de fournisseur ne déclare pas son type.
      classification_type_unexpected: >-
        Le type d'une classification de fournisseur (« %{type} ») n'est ni « string », ni
        « boolean », ni « codelist ».
      classification_without_supported_value: >-
        Une classification de fournisseur ne porte pas de sdg:SupportedValue.
      classification_supported_value_empty: >-
        Une valeur retenue d'une classification de fournisseur est vide.
      classification_values_counted: >-
        Une classification de fournisseur doit porter exactement une valeur retenue (%{count}
        déclarée(s)).
      classification_value_without_string_value: >-
        La valeur retenue d'une classification de fournisseur de type « string » ou « codelist »
        doit être une sdg:StringValue.
      classification_value_without_boolean_value: >-
        La valeur retenue d'une classification de fournisseur de type « boolean » doit être une
        sdg:BooleanValue.
      classification_without_scheme: >-
        L'identifiant d'une classification de fournisseur de type « codelist » ne porte pas
        d'attribut « schemeID ».
      classification_without_value_expression: >-
        Une classification de fournisseur de type « codelist » ne porte pas de
        sdg:ValueExpression.
      classification_expression_not_https: >-
        L'expression de valeurs d'une classification de fournisseur (« %{expression} ») ne commence
        pas par « https:// ».
      classification_description_without_language: >-
        La description d'une classification de fournisseur ne porte pas d'attribut « lang ».
      classification_description_language_unknown: >-
        La langue de la description d'une classification de fournisseur (« %{language} ») n'est pas
        un code de la liste LanguageCode.
      # R-EDM-REQ-S020 à S036, S055 et S061 : la forme RegRep des slots. Les
      # dix-neuf assertions comparent la seule partie locale de l'attribut —
      # substring-after(@xsi:type, ':') —, donc le préfixe n'est pas jugé :
      # « x:AnyValueType » les satisfait, et « AnyValueType » sans préfixe ne les
      # satisfait pas. Le contexte de seize d'entre elles est le rim:SlotValue
      # d'un slot présent — un slot absent ne déclenche rien, sa présence étant
      # l'affaire de S005 à S016 —, et celui de S027, S029 et S032 le rim:Element
      # des trois collections, un niveau plus bas. Ces refus repartent en
      # EDM:ERR:0003 : une réponse d'erreur ne recopie aucun xsi:type reçu.
      slot_type_unexpected: >-
        Le slot « %{name} » de la requête reçue doit porter un rim:SlotValue de type %{expected}
        (reçu : %{declared}).
      element_type_unexpected: >-
        Un rim:Element du slot « %{name} » de la requête reçue doit être de type %{expected}
        (reçu : %{declared}).
      unnamed_slot_type: attribut absent
      # R-EDM-REQ-S052 et S053 : ce qu'une collection RegRep doit porter. Leur
      # contexte compare l'attribut xsi:type entier, préfixe compris, là où les
      # règles ci-dessus n'en lisent que la partie locale — les deux lectures
      # sont différentes à dessein. Aucun ancêtre ne les restreint : elles
      # atteignent tout rim:SlotValue de la requête.
      collection_without_element: Une collection RegRep de la requête reçue ne porte aucun rim:Element.
      collection_type_unexpected: >-
        Une collection RegRep de la requête reçue doit porter collectionType="%{expected}"
        (reçu : %{declared}).
      # R-EDM-REQ-C092 : tout libellé fait au moins deux caractères, mesurés
      # après normalize-space — un seul pour sdg:LocatorDesignator et
      # sdg:StringValue, que le test excepte nommément. Le contexte ne porte
      # aucun ancêtre : la règle atteint les vingt-et-un éléments qu'elle nomme
      # où qu'ils soient, d'où le chemin dans la phrase. Les noms de l'agent
      # classé ER en sont exceptés — R-EDM-ERR-C027 les mesure à son tour dans la
      # réponse d'erreur, donc ces refus-là ne repartent pas et le journal est
      # leur seule trace.
      wording_too_short: >-
        Le libellé %{path} de la requête reçue (« %{value} ») fait moins de deux caractères.
      wording_empty: >-
        Le libellé %{path} de la requête reçue est vide, là où la règle exige un caractère.
    evidence_response:
      requester_without_id: L'agent requêteur est sans identifiant
      requester_without_scheme: L'agent requêteur est sans schéma d'identifiant
      # Les règles du chapitre 4.6 qu'une réponse reçue enfreint. Aucune ne
      # refuse quoi que ce soit : elles sont composées dans le `detail` de la
      # ligne `response_received` du journal, et l'échange se règle comme si de
      # rien n'était — voir docs/journal_des_echanges.md.
      slot_required: La réponse reçue doit porter exactement un slot « %{name} ».
      unexpected_specification: La réponse reçue annonce %{announced}, et non %{expected}.
      absent_status: La réponse reçue ne déclare aucun statut.
      unexpected_status: >-
        Le statut de la réponse reçue (%{announced}) n'est ni Success ni Unavailable.
      deferral_without_date: >-
        Une réponse au statut Unavailable doit porter exactement un slot « %{name} ».
      date_without_deferral: Le slot « %{name} » n'a de place que dans une réponse au statut Unavailable.
      absent_request_id: La réponse reçue ne déclare l'identifiant d'aucune requête.
      request_id_not_a_uuid: >-
        L'identifiant de la requête répondue (%{id}) n'est pas un UUID préfixé
        « urn:uuid: ».
      response_id_not_a_uuid: L'identifiant de la réponse (%{id}) n'est pas un UUID.
      issue_date_not_a_date_time: La date d'émission (%{value}) n'est pas une date-heure.
      available_date_not_a_date_time: >-
        La date de mise à disposition (%{value}) n'est pas une date-heure.
      provider_identifier_without_scheme: >-
        L'identifiant « %{id} » du fournisseur ne nomme pas son schéma.
      no_object_list: La réponse reçue ne porte pas de rim:RegistryObjectList.
      no_single_ep_agent: Le slot « EvidenceProvider » doit porter exactement un agent classé EP.
      exception_in_a_success: Une réponse en succès ne peut pas porter de rs:Exception.
      unexpected_child: L'élément « %{name} » n'a pas sa place dans une réponse.
      # Ce que la phrase met à la place d'une valeur absente, accordé avec ce
      # qu'elle nomme.
      absent_specification: une version sans nom
      absent_value: absent
      absent_date: absente
    requirements_response:
      requirement_without_id: L'annuaire a rendu une exigence sans identifiant.
    error_response:
      no_exception: Pas de rs:Exception dans la réponse d'erreur reçue.
    retrieved_message:
      unreadable_envelope: Enveloppe SOAP illisible.
      unknown_action: "Action ebMS inconnue : « %{action} »."
      unreadable_body: Corps RegRep illisible.
      no_payload: Pas de charge « %{type} » dans le message reçu.
      # La première partie MIME que le chapitre 4.8 fait consigner : l'entête doit
      # en déclarer une, et la charge qu'elle désigne doit être là.
      no_part: Le message reçu ne déclare aucune partie MIME.
      part_without_href: La première partie MIME du message reçu ne désigne aucune charge.
      payload_missing: Charge « %{id} » annoncée mais absente.
    ebms_header:
      no_header: Pas d'entête ebMS dans le message reçu.
      no_sender: Pas d'expéditeur dans l'entête du message reçu.
      timestamp_unreadable: "Horodatage illisible dans l'entête du message reçu : « %{value} »."
    common_services_response:
      not_a_query_response: La réponse de l'annuaire n'est pas une QueryResponse.
      unexpected_version: L'annuaire a répondu en %{announced}, et non en %{expected}.
      unnamed_version: une version sans nom
      refused_without_reason: L'annuaire a refusé sans dire pourquoi.
      refused: "L'annuaire a refusé : %{detail}"
      nothing_readable: >-
        L'annuaire a répondu avec succès, mais rien n'y était lisible
        (%{count} objet(s) dans la réponse).
  # Ce qu'un écran dit d'un objet, quand l'objet ne peut pas le dire lui-même.
  presenters:
    demo_identity:
      # Le vocabulaire de FranceConnect+, en toutes lettres : le code lui-même
      # n'est pas un mot, et le traduire côté requête est l'affaire du jeton du
      # bénéficiaire.
      genders:
        male: Masculin
        female: Féminin
        unspecified: Non précisé
      provenance:
        # Aucun claim ne nomme le pays ni le fournisseur d'identité étranger :
        # ce qui est attesté, c'est le passage par la passerelle.
        european: Identité d'un autre État membre, par la passerelle eIDAS
        unnamed: Provenance non attestée par l'authentification
      # Le cas nominal aujourd'hui : FranceConnect+ ne documente aucun claim qui
      # le porte pour un usager européen, et le chapitre 2.1 §2.3.1.2 prévoit la
      # requête sans lui.
      no_identifier: Non rendu par l'authentification
  models:
    # La règle `R-EDM-*` enfreinte et ce qu'elle dit, composées en une phrase :
    # c'est sous cette forme que le journal la consigne.
    business_rule_violation:
      sentence: "%{rule} : %{description}"
    # Les trois seules valeurs que `R-EDM-REQ-C119` laisse passer : le message
    # nomme celles qui ont été demandées et celles qui existent, faute de quoi
    # la faute de frappe se cherche à la main.
    associated_document:
      unrequestable: >-
        Documents associés inconnus : %{values}. Seuls %{requestable} peuvent être demandés.
    # La raison que `Exchange#expire!` inscrit, et que la console lit sous
    # « Raison de l'échec ». Une par sens, sous la même clé pour qu'on ne
    # récrive pas l'une sans voir l'autre : `EDM:ERR:0005` couvre les deux.
    #
    # L'entrante nomme la cause et non l'acteur : la France n'a pas décidé de se
    # taire, l'échange est mort en chemin faute de worker, et « n'a pas répondu »
    # prêterait une décision à une panne devant l'exploitant qui la diagnostique.
    exchange:
      expired:
        incoming: L'échange n'a pas été traité dans le délai imparti.
        outgoing: Le correspondant n'a pas répondu dans le délai imparti.
    strict_validation:
      invalid: "%{subject} : %{errors}."
      # Le porteur, que l'objet de valeur ne peut pas connaître : une
      # `EbmsIdentity` ne sait pas si elle décrit un requêteur, un fournisseur
      # ou un point d'accès.
      subjects:
        announced_access_point: Le point d'accès annoncé par l'annuaire
        announced_data_service: Le service de données annoncé par l'annuaire
