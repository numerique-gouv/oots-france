  evidence_requests:
    unknown: Cette demande est inconnue.
    beneficiary_required: Le bénéficiaire doit être renseigné
    conversation_invalid: L'identifiant de conversation doit être un UUID
  interactors:
    # Les échecs que `fail_with_error` nomme, et qu'`ApplicationInteractor`
    # énumère. La console les affiche en titre d'alerte ; le contrôleur JSON, lui,
    # ne rend que les `errors` qui les accompagnent.
    failures:
      # Même phrase qu'`admin.common_services.refused`, et deux clés à dessein :
      # celle-ci nomme l'échec d'un interacteur, que la console rend par clé sur
      # `@lookup.error[:key]` ; l'autre est le titre que deux gabarits disent
      # littéralement, sur des pages où aucun interacteur ne tourne — sa note
      # dit ce que les récrire séparément coûterait.
      common_services_refused: L'annuaire a refusé
      # Les quatre refus que la démarche de démonstration reçoit du contrat, et
      # qu'elle rend tels quels à l'usager : ce sont ceux qu'un fournisseur de
      # service reçoit, et la démonstration les montre comme elle montre le
      # reste. Aucun échange n'est ouvert dans les quatre cas — c'est ce que la
      # page dit sous l'alerte, et non ici.
      #
      # Le message rendu par le contrat voyage sous le titre, jamais dedans :
      # c'est là que se lit `EB:ERR:0001`. Seul `demo_unexpected` ne peut pas
      # nommer ce qui s'est passé, et porte donc le statut dans son corps.
      # Les deux refus que la démarche oppose à une remise de justificatif, et
      # que personne ne lit à l'écran : c'est `EvidenceForwarder` qui les reçoit,
      # en statut. Écrits ici parce qu'un `fail_with_error` sur une clé absente
      # de `FAILURES` n'a pas de libellé, et qu'une clé sans libellé est une
      # alerte vide le jour où une page la rend.
      demo_evidence_empty: Le justificatif remis ne portait aucun octet
      demo_unplaceable: Le justificatif remis ne se rattache à aucune demande
      demo_locked: Le requêtage est verrouillé sur ce déploiement
      demo_refused: La demande de justificatif a été refusée
      demo_unexpected: Réponse inattendue du service de requête
      demo_unreachable: Le service de requête n'a pas pu être joint
      gateway_refused: La passerelle a refusé le message
      identification_refused: L'identification par FranceConnect+ n'a pas abouti
      invalid_configuration: Cette installation ne peut pas construire le message
      invalid_directory_entry: L'annuaire a publié une entrée qu'un message ne peut pas porter
      invalid_token: Jeton bénéficiaire invalide
      no_evidence_type: Aucun type de justificatif dans ce pays
      no_provider: Aucun fournisseur dans ce pays
      unknown_country: Pays inconnu des annuaires
      unknown_procedure: Démarche inconnue des annuaires
      unknown_requester: Requêteur inconnu
      unsupported_specification: Le point d'accès ne parle pas notre version du modèle
    # Les deux moitiés de la cinématique européenne. Chaque phrase est un refus
    # que l'exploitant lit sous le titre ci-dessus, et qui doit lui dire ce qui
    # a cédé sans qu'il ait à ouvrir les logs.
    demo:
      # Écrit dans les logs et jamais à l'écran : l'exploitant est déconnecté
      # quoi qu'il arrive, et FranceConnect+ ferme sa propre session d'elle-même.
      end_identification:
        unreachable: "Fin de session FranceConnect+ impossible, l'exploitant est déconnecté malgré tout : %{error}"
      start_identification:
        undiscoverable: "FranceConnect+ n'a pas répondu à la découverte de sa configuration : %{error}"
      request_evidence:
        unreachable: "Contrat de requête de justificatif injoignable, ou jeu de clés inexploitable : %{error}"
      # Consignés dans le journal applicatif et jamais à l'écran : le lecteur est
      # OOTS-France, qui reçoit un statut, et l'usager de la démarche n'a rien
      # demandé au moment où ces lignes s'écrivent. Le chapitre 4.10 §4.1,
      # informatif, veut le premier là — « In case this value is not linked to
      # any known current user and/or user session, the event is logged for
      # investigation. » Le second, une remise sans octet, ne relève d'aucun
      # chapitre : c'est une garde de ce dépôt.
      receive_evidence:
        unplaceable: >-
          Justificatif remis pour l'échange %{exchange} et la conversation %{conversation} :
          la démarche de démonstration n'a ouvert aucune demande sous ces identifiants, remise refusée.
        empty: "Justificatif remis sans aucun octet pour l'échange %{exchange} : remise refusée."
        unnamed: non fourni
      complete_identification:
        refused_by_portal: "FranceConnect+ a refusé l'identification (%{error}) : %{description}"
        no_description: sans autre explication
        unexpected_state: >-
          Ce retour ne correspond à aucune identification demandée depuis ce navigateur.
        unexpected_nonce: >-
          L'ID Token ne porte pas le nonce de l'appel : il ne répond pas à cette identification.
        level_too_low: "Le niveau de garantie obtenu (%{reached}) est inférieur à celui demandé (%{requested})."
        no_level: aucun
        subjects_differ: >-
          L'ID Token et la réponse UserInfo ne désignent pas la même personne.
        refused: "Identification FranceConnect+ refusée : %{reason}"
    evidence_provision:
      choose_answer:
        # Le rejeu d'un identifiant de requête, que le chapitre 4.4 impose de
        # refuser, et la version que l'entête annonce sans que le corps la
        # confirme.
        request_replayed: "Identifiant de requête déjà traité : %{id}"
        unexpected_version: L'entête du message reçu annonce %{announced}, et non %{expected}.
        unnamed_version: une version sans nom
      journal_answer:
        unknown_exchange: "Échange inconnu au moment de répondre : %{id}"
      reject_malformed_identifiers:
        # Un refus qui ne part pas au correspondant : la réponse réutiliserait
        # l'identifiant qu'on lui reproche. La règle est nommée pour le journal,
        # qui est alors le seul endroit où la décision se relit.
        malformed_identifier: >-
          L'identifiant %{element} « %{value} » n'est pas un UUID, que %{rule} exige : aucune réponse
          ne peut être signée sur cet échange.
      reject_unanswerable_requester:
        # Même raison que ci-dessus, sur l'agent requêteur cette fois : une
        # ExceptionResponse recopierait l'identifiant, le schéma, le nom et la
        # langue qu'on lui reproche.
        unanswerable: >-
          %{reason} (%{rule}) : aucune réponse ne peut nommer ce requêteur sans enfreindre à son tour
          les règles de la réponse d'erreur.
        unnamed_rule: sans règle nommée
    evidence_request:
      # Le point d'accès retenu n'annonce aucune des deux versions que la France
      # parle. Rien n'est émis, et la description est le seul endroit qui le dit
      # — l'échange ne porte aucun code EDM.
      choose_specification:
        unsupported: >-
          Le point d'accès %{access_point} annonce %{announced} ; la France parle %{spoken} : la
          requête n'est pas émise.
      send_to_gateway:
        # La panne est nommée comme locale : aucune des huit exceptions du
        # chapitre 4.5.3 ne décrit un émetteur incapable de construire son
        # propre message, et l'échange ne porte donc aucun code EDM. La
        # description est le seul endroit qui dit à qui la panne appartient.
        invalid_configuration: "La configuration de cette installation ne permet pas de construire la requête : %{error}"
    incoming_message:
      open_exchange:
        unidentified: L'entête ne porte pas les deux identifiants de corrélation exigés.
      settle_exchange:
        unknown: "Échange inconnu : %{id}"
        already_settled: "Réponse ignorée, l'échange %{id} est déjà réglé"
        already_delivering: "Réponse ignorée, un autre traitement remet déjà le justificatif de l'échange %{id}"
        foreign_request: "Réponse ignorée, elle ne porte pas l'identifiant de requête de l'échange %{id}"
      process:
        exchange_failed: L'échange a échoué
        exchange_impossible: Échange impossible à mener à son terme
        # Soldé sans code EDM, mais pas pour la raison écrite sur
        # `send_to_gateway` ci-dessus : là, la France est le client, et les huit
        # exceptions du chapitre 4.5.3 sont toutes « generated by server ». Ici
        # elle est ce server, et `EDM:ERR:0008` couvre littéralement « a problem
        # […] during the processing of a QueryRequest ». Ce qui l'écarte est
        # ailleurs — un code ne vit que dans une réponse d'erreur transmise, et
        # aucune ne part : le message reçu est effacé, et construire la réponse
        # lirait les variables mêmes qui manquent. L'écrire ferait lire à la
        # console une exception que le correspondant n'a jamais reçue.
        invalid_configuration: La configuration de cette installation ne permet pas de traiter ce message
        unreadable: Message illisible
        unreadable_logged: "Message illisible (%{id}) : %{error}"
        unknown_action: "Action ebMS inconnue : « %{action} »."
        abandoned: "%{reason} : %{error}"
