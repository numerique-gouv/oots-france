        # La page où s'arrête un parcours sans demande explicite : rien n'a été
        # résolu, rien n'a été demandé à personne, aucun échange n'existe.
        create:
          title: Justificatif à fournir vous-même
          lead: >-
            Vous n'avez pas demandé que votre justificatif d'inscription soit récupéré
            automatiquement. Aucune demande n'a été faite : il vous faudra le joindre vous-même à
            votre dossier.
          back: Revenir au formulaire
        # L'ordre des clés n'est pas celui de l'écran, que le gabarit fixe : ces
        # intitulés sont ceux des deux tableaux, dits une fois chacun.
        attributes:
          family_name: Nom de famille
          given_name: Prénom(s)
          birthdate: Date de naissance
          gender: Sexe
          place_of_birth: Lieu de naissance
          level_of_assurance: Niveau de garantie
          provenance: Provenance de l'identité
          eidas_identifier: Identifiant eIDAS
      # La troisième page : ce que l'exigence 27 du chapitre 1 §2 des TDD demande
      # de montrer « before any request is made » — le nom du fournisseur et le
      # type de justificatif —, puis le résultat du geste qui fait partir la
      # requête.
      confirmations:
        show:
          title: Confirmer la demande de justificatif
          lead: >-
            Voici l'administration à qui votre justificatif d'inscription sera demandé, et le type
            de document qu'elle transmettra. Rien n'est demandé tant que vous n'avez pas confirmé.
          caption: Ce qui sera demandé
          # Les deux valeurs sont rendues telles que les annuaires les publient,
          # sans libellé de notre cru : la démonstration montrerait sinon autre
          # chose que ce sur quoi l'échange repose.
          provider: Administration qui détient le justificatif
          evidence_type: Type de justificatif
          submit: Confirmer et demander le justificatif
          back: Revenir au formulaire
          unreachable: Les annuaires européens n'ont pas pu être joints
        # Seul un refus s'affiche ici : une demande qui part mène au suivi.
        create:
          title: Demande de justificatif
          nothing_opened: >-
            Aucun échange n'a été ouvert : la demande a été refusée avant que quoi que ce soit ne
            parte vers un autre État membre.
          back: Revenir au formulaire
      # La quatrième page du parcours : ce que la demande a obtenu. Les quatre
      # états qu'elle rend sont ceux que le contrat rend, plus l'attente, qui est
      # tout le reste — la démarche ne demandant que T1, que la France sert
      # toujours par un document.
      trackings:
        show:
          title: Suivi de la demande
          # Le justificatif est rendu tel qu'il a été reçu : le chapitre 1 §4.2
          # laisse l'usager décider de ne pas s'en servir, jamais d'en changer le
          # contenu.
          delivered: Le justificatif est arrivé
          delivered_body: >-
            L'administration qui détient votre justificatif d'inscription l'a transmis. Il vous est
            remis tel qu'elle l'a établi : vous pouvez l'ouvrir et l'enregistrer, sans le modifier.
          open: Ouvrir le justificatif
          # Le chapitre 2.1 §3.3 impose ce message à une seule condition — « If
          # the process of identity and evidence matching does not result in a
          # match or the identity matching generates two or more results » —, et
          # le chapitre 4.10 §2.1, informatif, le recommande pour tout refus.
          # La démarche le dit pour tous, ce qui va au-delà du `MUST`.
          refused: Le justificatif ne peut pas être fourni
          refused_body: >-
            L'administration sollicitée n'a pas transmis de justificatif. Le code ci-dessous dit
            pourquoi ; il faudra obtenir ce document par un autre moyen.
          # Le premier des quatre points que le `shall` du chapitre 4.9 §5
          # énumère, et le seul que la démonstration tienne : reconnaître la
          # réponse. Le deuxième — « Provide a departure page for the user to
          # navigate to the Preview Space » — n'est justement pas tenu.
          preview: Le justificatif attend votre accord à l'étranger
          preview_body: >-
            L'administration sollicitée veut vous montrer le document avant de le transmettre, sur
            son propre espace. La démonstration s'arrête ici : elle reconnaît cette réponse et vous
            donne l'adresse, sans vous y conduire.
          pending: La demande est en cours
          pending_body: >-
            Votre justificatif d'inscription a été demandé à l'administration qui le détient. La
            réponse ne revient pas sur cette connexion : elle arrive par un autre canal, parfois
            après un moment. Redemandez cette page pour savoir où elle en est.
          unreachable: Le service de requête n'a pas pu être joint
          unreadable: L'état de la demande n'a pas pu être lu
          caption: Ce qui identifie cette demande
          # Les deux identifiants sous lesquels l'exploitant retrouve l'échange
          # au journal.
          exchange: Identifiant de l'échange
          conversation: Identifiant de la conversation
          # L'empreinte des octets réellement servis : c'est elle qui atteste que
          # le document n'a pas été retouché entre la remise et l'écran.
          digest: Empreinte SHA-256 du justificatif
          code: Code d'erreur reçu
          preview_location: Adresse de prévisualisation
          refresh: Actualiser le suivi
          again: Faire une nouvelle demande
      evidences:
        show:
          # Le nom proposé par le navigateur à l'enregistrement.
          filename: justificatif.pdf
    common_services:
      # Le décompte d'une liste que la barre de recherche restreint : ce qu'il
      # compte change à la frappe, et nommer l'objet dirait le total.
      results:
        count:
          zero: Aucun résultat
          one: Un résultat
          other: "%{count} résultats"
      # Le titre des deux alertes de refus qu'un contrôleur rattrape lui-même,
      # `refus.html.erb` et `providers/index.html.erb` — d'où sa place un cran
      # au-dessus des deux gabarits qui la partagent. La page des résolutions,
      # elle, nomme l'échec de l'interacteur qui l'a prononcé, et porte donc la
      # même phrase sous `interactors.failures.common_services_refused` :
      # récrire l'une sans l'autre fait diverger le libellé de trois pages
      # voisines. Ce que le corps porte déjà — le code que l'annuaire a nommé,
      # puis son message — n'a pas à être reposé au-dessus : le titre dit ce qui
      # s'est passé.
      refused: L'annuaire a refusé
      refus:
        unreachable: Annuaire injoignable
      catalogue:
        show:
          lead: >-
            Ce que l'Evidence Broker et le Data Service Directory publient, tel qu'ils le
            répondent à cette application.
          tiles:
            countries:
              zero: Aucun pays n'a publié de déclaration.
              one: Un pays, et les démarches qu'il déclare.
              other: "%{count} pays, et les démarches que chacun déclare."
            procedures:
              zero: Aucun code de démarche déclaré.
              one: Un code de démarche, déclaré par %{countries}.
              other: "%{count} codes de démarche, déclarés par %{countries}."
            requirements:
              zero: Aucune exigence publiée.
              one: Une exigence, et les types de justificatif qui la satisfont.
              other: "%{count} exigences, et les types de justificatif qui les satisfont."
          providers:
            title: Et les fournisseurs ?
            body: >-
              Le Data Service Directory ne répond que sur un couple type de justificatif et
              pays : il n'existe aucune liste de ses fournisseurs. On y arrive depuis une
              exigence, puis un type de justificatif.
      resolutions:
        show:
          title: Simuler une chaîne de requêtes
          lead: >-
            Les trois questions qu'une requête réelle pose aux annuaires avant d'émettre,
            dans l'ordre, avec les mêmes clients.
          legend: Interroger les annuaires
          procedure: Démarche
          country: Pays fournisseur
          submit: Résoudre
          # L'asymétrie que la page existe pour rendre visible : la démarche est
          # la nôtre, les types de justificatif appartiennent au pays interrogé.
          requirements:
            title: 1. Ce que la démarche exige
            lead_html: >-
              Evidence Broker, dans le pays <strong>requêteur</strong> — le nôtre, %{country},
              puisque la démarche %{procedure} est la nôtre.
            # Une exigence, d'où l'accord ; l'étape suivante parle d'un type de
            # justificatif et porte donc ses propres clés.
            chosen: Retenue
            choose: Poursuivre avec celle-ci
          evidence_types:
            title: 2. Ce qui satisfait cette exigence
            lead_html: >-
              Evidence Broker, dans le pays <strong>fournisseur</strong> — %{country},
              celui qui délivrera le justificatif.
            chosen: Retenu
            choose: Poursuivre avec celui-ci
          providers:
            title: 3. Qui le délivre, et par où
            lead_html: >-
              Data Service Directory, dans le pays <strong>fournisseur</strong> — %{country}.
              C'est le point d'accès de cette réponse que la requête réelle adresse.
            detail: point d'accès %{access_point} · destinataire final %{recipient}
      procedures:
        # La démarche d'essai « 00 » ne figure dans aucune liste de codes, et un
        # État membre en déclare de temps en temps une que la liste ignore.
        no_label: Aucun label
        count:
          zero: Aucune démarche
          one: Une démarche
          other: "%{count} démarches"
        index:
          title: Démarches
          lead: Une même démarche est déclarée par plusieurs pays, chacun avec son intitulé.
          search: Rechercher un code, un intitulé, un pays
          declared_by: Démarche déclarée par
          empty: Aucune démarche ne correspond à cette recherche.
        show:
          title: Démarche %{code}
          declared_by:
            zero: Aucun pays n'a déclaré de démarche sous ce code.
            one: Un pays a déclaré une démarche sous ce code.
            other: "%{count} pays ont déclaré une démarche sous ce code."
        country:
          title: "%{procedure} — %{country}"
      requirements:
        count:
          zero: Aucune exigence
          one: Une exigence
          other: "%{count} exigences"
        # La liste des exigences et celle des justificatifs d'un pays cherchent
        # toutes deux dans des exigences, et le disent de la même façon.
        empty: Aucune exigence ne correspond à cette recherche.
        index:
          title: Exigences
          lead_html: >-
            Ce qu'une démarche impose de prouver. Une même exigence sert des démarches de
            plusieurs pays <strong>requêteurs</strong>, et chaque carte mène aux pays
            <strong>fournisseurs</strong> qui la satisfont — ceux qui publient un type de
            justificatif pour elle, et dont la liste diffère de l'un à l'autre.
          search: Rechercher une exigence, un pays fournisseur, son code
          published_by: Justificatifs publiés par
          nobody: Aucun pays ne publie de justificatif pour cette exigence.
          # Dite pendant que la page va chercher sa liste : une requête par
          # exigence part d'ici, et le lecteur n'aurait sinon rien à lire. La
          # phrase est entière, l'accord ne survivant pas à un nom interpolé.
          loading: Chargement de toutes les exigences publiées, veuillez patienter.
        # La page de l'exigence et celle d'un de ses pays fournisseurs portent le
        # même bouton, vers la même page, et la même phrase sur leurs cartes.
        see_procedures: Voir les démarches qui l’exigent
        # Le titre de la page est loin au-dessus quand on est descendu de vingt
        # cartes : chacune redit de quelle exigence elle parle.
        card_html: Ce qui satisfait l'exigence « <em>%{requirement}</em> » %{country}.
        show:
          # Le repli quand l'annuaire ne publie pas d'intitulé pour l'exigence.
          title: Exigence
          by_country: Justificatifs satisfaisant cette exigence, par pays
          lead_html: >-
            Liste des justificatifs que chaque pays <strong>fournisseur</strong> publie
            pour cette exigence. Le pays qui l'exige n'est pas celui qui la satisfait : le
            justificatif est demandé à celui qui le détient.
          search: Rechercher un pays fournisseur, son code, un type de justificatif
          empty: Aucun type de justificatif ne correspond à cette recherche.
        country:
          title: "%{country} — %{requirement}"
        procedures:
          title: Démarches — %{requirement}
          crumb: Démarches qui l’exigent
          declared_by: Exigence déclarée par
          heading: Démarches qui exigent « %{requirement} »
          lead_html: >-
            Les démarches qui reposent sur cette exigence, et les pays <strong>requêteurs</strong> qui les déclarent.
          no_country: Aucun pays publié pour cette déclaration.
      evidence_type_lists:
        combination_html: Combinaison <strong>%{label}</strong>, exigée d'un bloc
        see_providers: Voir les fournisseurs
      # Ce que le pays déclare, et non ce que l'annuaire ignore : le chapitre
      # 3.2.4 sépare ce cas d'`EB:ERR:0001`, qui dit que l'Evidence Broker n'a
      # aucune information. La raison, quand l'annuaire en publie une, s'affiche
      # telle quelle sous cette phrase.
      no_match:
        declared: Ce pays déclare ne délivrer aucun justificatif pour cette exigence.
      # Une phrase déguisée en donnée : elle s'affiche comme le paramètre d'une
      # requête que l'Evidence Broker n'accepte pas telle quelle. Les deux pages
      # qui balayent le catalogue la disent, d'où sa place au-dessus d'elles.
      swept:
        zero: aucune exigence du catalogue
        one: l'unique exigence du catalogue
        other: chacune des %{count} exigences du catalogue
      countries:
        count:
          zero: Aucun pays
          one: Un pays
          other: "%{count} pays"
        index:
          title: Pays
          lead: >-
            Les États membres qui ont publié au moins une déclaration à l'Evidence
            Broker. Un pays absent d'ici n'a rien déclaré, ce qui n'est pas la même chose
            que ne pas être inscrit au Data Service Directory.
          roles:
            title: Requêteur ou fournisseur ?
            body_html: >-
              Un pays tient deux rôles, et l'annuaire ne répond pas la même chose selon
              celui qu'on lui demande. <strong>Requêteur</strong>, il déclare ses démarches
              et ce qu'elles exigent de prouver : c'est ce que ces pages montrent.
              <strong>Fournisseur</strong>, il délivre les justificatifs qui satisfont une
              exigence — la sienne ou celle d'un autre —, et cela se lit sous l'exigence.
            requester_html: En <strong>requêteur</strong> — %{procedures}
            provider_html: En <strong>fournisseur</strong>
          # Un fragment traduit ne se concatène pas : la phrase entière, accord
          # compris, tient dans la clé.
          declared_procedures:
            zero: aucune démarche déclarée
            one: une démarche déclarée
            other: "%{count} démarches déclarées"
          search: Rechercher un pays, son code
          see_procedures: Voir ses démarches
          see_evidence: Voir ses justificatifs
          empty: Aucun pays ne correspond à cette recherche.
        procedures:
          title: Démarches de %{country}
          lead_html: >-
            Ce pays en <strong>requêteur</strong> : les démarches sous lesquelles il a publié une déclaration, et ce que
            chacune lui fait exiger. Ce qu'il délivre, lui, se lit sous chaque exigence.
        procedure:
          title: "%{country} — %{procedure}"
        requirements:
          title: Justificatifs de %{country}
          crumb: Justificatifs
          lead_html: >-
            Ce pays en <strong>fournisseur</strong> : les exigences pour lesquelles il publie un type de justificatif, quel que
            soit le pays qui les impose. C'est ce qu'un correspondant obtient en lui adressant une requête.
          search: Rechercher une exigence, un type de justificatif
          card: Ce qui satisfait cette exigence %{country}.
          # Comme celle de la liste des exigences, et pour la même raison : la
          # page balaye le catalogue avant de pouvoir écrire une seule ligne.
          loading: Chargement de tous les justificatifs publiés par ce pays, veuillez patienter.
      declarations:
        role_html: "%{country}, en <strong>requêteur</strong>"
        lead_html: >-
          Ce que ce pays exige de prouver pour cette démarche. Chaque exigence mène à ce qui la satisfait, dans
          <strong>tous</strong> les pays fournisseurs : l'usager qui accomplit cette démarche peut tenir son justificatif
          de n'importe lequel d'entre eux.
        no_requirement: Déclaration sans exigence publiée
        no_detail: Sans description publiée.
        empty: Aucune déclaration de cette démarche dans ce pays.
      providers:
        index:
          title: Qui délivre « %{evidence_type} » ?
          heading: Qui délivre « %{evidence_type} » %{country}
          lead: >-
            L'organisation qui détient ce justificatif, et le point d'accès par lequel une
            requête réelle l'atteint.
          data_service: Service de données
          level_of_assurance_html: Niveau de garantie <strong>%{level}</strong>
          service_id_html: Identifiant du service <code>%{id}</code>
          # L'anomalie que la page existe pour rendre lisible : sans ces deux
          # clés, un `sdg:DistributedAs` absent s'affiche comme un format vide.
          no_distribution: Aucune distribution publiée
          no_distribution_detail_html: >-
            Le Data Service Directory n'a publié aucun <code>sdg:DistributedAs</code> —
            <code>%{rule}</code> le rend obligatoire.
          # Le modèle de données de la distribution, à ne pas confondre avec les
          # « versions déclarées » du point d'accès juste dessous : deux éléments
          # distincts sous deux parents distincts, d'où deux libellés sans aucun
          # mot commun.
          data_model_html: Modèle de données <code>%{model}</code>
          # L'absence de ce modèle est deux états et non un : C039 et C041 excusent
          # une distribution structurée que le même enregistrement publie aussi dans
          # un format non structuré, et accusent l'annuaire quand il ne le fait pas.
          # La règle est interpolée, C039 jugeant l'XML et C041 le JSON.
          data_model_missing: Modèle de données manquant
          data_model_missing_detail_html: >-
            Ce justificatif n'est distribué dans aucun format non structuré :
            <code>%{rule}</code> impose alors un <code>sdg:ConformsTo</code>.
          data_model_waived_html: >-
            Modèle de données non exigé : ce justificatif est aussi distribué dans un format
            non structuré, ce qui lève <code>%{rule}</code>.
          access_point_html: >-
            Point d'accès <strong>%{label}</strong>
            — <code>%{id}</code>,
            versions déclarées <code>%{versions}</code>
          empty: Aucun service de données pour ce couple.
