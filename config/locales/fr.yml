fr:
  # `Exchange` est le seul modèle persisté dont une validation s'adresse à un
  # humain : ses traductions vivent sous `activerecord`, que Rails interroge
  # d'après le `i18n_scope` de la classe.
  # Sous `activemodel`, elles ne seraient jamais trouvées — la validation
  # échouerait bien, mais avec le message générique de Rails.
  activerecord:
    attributes:
      exchange:
        exchange_id: L'identifiant d'échange
        conversation_id: L'identifiant de conversation
        preview_location: L'adresse de prévisualisation
    errors:
      models:
        exchange:
          attributes:
            exchange_id:
              format: doit être un UUID
            conversation_id:
              format: doit être un UUID
            preview_location:
              format: doit être une adresse http ou https
  activemodel:
    # Les identifiants sont anglais, parce que c'est le vocabulaire des TDD ;
    # ce qui s'affiche ne l'est pas. Sans ces traductions, un message mêlerait
    # les deux langues — « Country doit être un code pays ».
    attributes:
      address:
        country: Le pays
      ebms_identity:
        id: L'identifiant
        type_id: Le schéma d'identifiant
      access_point:
        id: L'identifiant
        type_id: Le schéma d'identifiant
      natural_person:
        family_name: Le nom
        given_name: Le prénom
        date_of_birth: La date de naissance
      legal_person:
        legal_name: La raison sociale
        eidas_identifier: L'identifiant eIDAS
      evidence_type:
        id: L'identifiant
        distribution_format: Le format de distribution
      requirement:
        id: L'identifiant
      data_service:
        id: L'identifiant
        evidence_type_classification: Le type de justificatif
        distribution_format: Le format de distribution
        distribution_language: La langue de distribution
        distribution_conforms_to: Le modèle de données de la distribution
      evidence_requester:
        id: L'identifiant
      evidence_provider:
        access_point: Le point d'accès
      resolution_filter:
        procedure_code: La démarche
        country_code: Le pays
        requirement_id: L'exigence
        evidence_type_id: Le type de justificatif
      exchange_filter:
        status: L'état
        country_code: Le pays
        evidence_requester_id: Le requêteur
        procedure_code: La démarche
        conversation_id: La conversation
        depuis: La date de début
        jusqu_a: La date de fin
      audit_event_filter:
        event_type: Le type d'événement
        exchange_id: L'identifiant d'échange
        conversation_id: L'identifiant de conversation
        country_code: Le pays
        evidence_requester_id: Le requêteur
        procedure_code: La démarche
        depuis: La date de début
        jusqu_a: La date de fin
      subject_search:
        family_name: Le nom d'usage
        given_name: Le prénom
        date_of_birth: La date de naissance
    errors:
      models:
        address:
          attributes:
            country:
              format: doit être un code pays à deux lettres
        natural_person:
          attributes:
            date_of_birth:
              format: doit être une date ISO 8601 (AAAA-MM-JJ)
        legal_person:
          attributes:
            eidas_identifier:
              format: doit être de la forme PAYS/PAYS/IDENTIFIANT
          unpublished_identifier_scheme: "un identifiant relève d'un schéma que les TDD ne publient pas : %{schemes}"
          valueless_identifier: "un identifiant est déclaré sans valeur : %{schemes}"
        requirement:
          attributes:
            id:
              format: doit être une URL du dépôt sémantique terminée par un UUID
          # Invariable, faute de savoir laquelle des formulations est en cause.
          unlabelled_wording: une formulation ne nomme pas sa langue
        data_service:
          attributes:
            id:
              format: doit être un UUID
            evidence_type_classification:
              format: doit être une URL du dépôt sémantique terminée par un UUID
            distribution_language:
              format: doit être un code langue de deux lettres majuscules
            distribution_conforms_to:
              format: doit être une URL du dépôt sémantique sous « datamodels/ »
          unlabelled_wording: une formulation ne nomme pas sa langue
        resolution_filter:
          attributes:
            country_code:
              format: doit être un code pays à deux lettres
          unreadable: est illisible
        exchange_filter:
          attributes:
            status:
              inclusion: n'est pas un état connu
            country_code:
              format: doit être un code pays à deux lettres
            jusqu_a:
              before_start: est antérieure à la date de début
          # Invariable, faute de savoir le genre de l'attribut qui le portera.
          unreadable: est illisible
        audit_event_filter:
          attributes:
            event_type:
              inclusion: n'est pas un type d'événement connu
            country_code:
              format: doit être un code pays à deux lettres
            jusqu_a:
              before_start: est antérieure à la date de début
          unreadable: est illisible
        subject_search:
          attributes:
            date_of_birth:
              format: doit être une date ISO 8601 (AAAA-MM-JJ)
          unreadable: est illisible
  accueil:
    index:
      lead: >-
        Ce service échange des justificatifs avec les autres États membres de l'Union européenne,
        pour le compte des démarches administratives françaises. Il s'adresse à des systèmes,
        non à des usagers : une personne qui cherche à faire venir un justificatif passe par le
        portail de la démarche.
      open_admin: Ouvrir l’espace d’administration
  layouts:
    application:
      # Le nom du service, que le titre de l'onglet, le bloc service de l'entête
      # et la page d'accueil disent tous les trois.
      name: OOTS-France
      skiplink: Accès rapide
      skiplink_content: Contenu
    # Le bloc-marque du DSFR se lit sur deux lignes, la seconde après un saut.
    # L'entête et le pied de page le disent tous les deux.
    logo_html: République<br>Française
    entete:
      tagline: Échange transfrontalier de justificatifs
      directories: Annuaires
      jobs: Jobs
      journal: Journal
      sign_out: Se déconnecter
    pied_de_page:
      # L'adresse du lien reste dans le gabarit : `fr.yml` n'a pas à devenir
      # l'endroit où l'on va corriger un lien mort.
      about_html: OOTS-France met en œuvre le %{tdd} du règlement européen sur le portail numérique unique.
      tdd: système technique « une fois pour toutes »
  components:
    admin_breadcrumbs:
      admin: Espace d’administration
    # Ce que le cadenas ouvert signifie, écrit hors écran parce qu'une icône
    # seule ne le dit qu'à l'œil, et repris en infobulle pour qui la survole.
    # Le bouton qui déplie le corps RegRep d'un événement : il en annonce la
    # taille, un document de métadonnées faisant plusieurs kilo-octets.
    regrep_body:
      summary: Afficher le corps (%{size})
    decrypted_value:
      label: Donnée personnelle déchiffrée
    directory_breadcrumbs:
      directories: Annuaires centraux
    directory_query:
      section: Requête effectuée
      identifiers_title: Identifiants
      # Nommés à l'appel par un symbole : quatre gabarits les affichent, et un
      # cinquième ne doit pas pouvoir inventer un cinquième intitulé.
      identifiers:
        requirement: Exigence
        evidence_type: Type de justificatif
    edm_error_code:
      chapter: Chapitre 4.5.3 des TDD, qui définit les huit codes (nouvelle fenêtre)
      # Les huit codes de la liste publiée avec les TDD, glosés pour un
      # exploitant. Le libellé que porte le message, lui, reste dans
      # `EdmException#message` : c'est celui qui part sur le fil, mot pour mot.
      codes:
        "EDM:ERR:0001": Authentification échouée
        "EDM:ERR:0002": Autorisation manquante
        "EDM:ERR:0003": Requête syntaxiquement ou sémantiquement invalide
        "EDM:ERR:0004": Objet introuvable
        "EDM:ERR:0005": Délai d'expiration dépassé
        "EDM:ERR:0006": Objet référencé impossible à résoudre
        "EDM:ERR:0007": Fonction ou capacité facultative non prise en charge
        "EDM:ERR:0008": Requête dont la syntaxe ou la sémantique doit être corrigée
    # Le Schematron plutôt que le chapitre, qui porte la règle lui aussi : le
    # premier est épinglé sur une étiquette de version, le second est une page
    # vivante.
    tdd_rule:
      schematron: Cette règle des TDD, telle que le Schematron l'écrit (nouvelle fenêtre)
    pagination:
      previous: Page précédente
      next: Page suivante
      page: Page %{number}
  builders:
    evidence_request_builder:
      unknown_subject: "Sujet de justificatif d'un type que la requête ne sait pas écrire : « %{type} »."
    evidence_subject_builder:
      unknown_subject: "Sujet de justificatif d'un type que la réponse ne sait pas écrire : « %{type} »."
  clients:
    common_services_instance:
      dns_failure: "Résolution DNS impossible pour « %{name} » : %{error}."
    common_services_query:
      unreachable: "Annuaire injoignable (%{url}) : %{error}."
      not_cached: "Réponse d'annuaire non mise en cache (%{url}) : %{error}"
    code_list:
      nothing_read: "Liste de codes lue sans y rien trouver (%{list}) : structure inattendue ?"
    common_services_signature:
      invalid: Signature invalide sur la réponse de l'annuaire.
      digest_mismatch: L'empreinte annoncée ne couvre pas la réponse de l'annuaire.
      not_http_headers: Signature de l'annuaire non conforme au mécanisme HttpHeaders.
      no_certificate: La réponse de l'annuaire ne porte aucun certificat.
      certificate_rejected: "Certificat de l'annuaire rejeté par le magasin de confiance : %{error}."
      header_unreadable: En-tête de signature illisible sur la réponse de l'annuaire.
      header_unreadable_detail: "En-tête de signature illisible sur la réponse de l'annuaire : %{error}."
      certificate_unreadable: "Certificat illisible dans la réponse de l'annuaire : %{error}."
    beneficiary_token:
      invalid: "Jeton bénéficiaire invalide : %{error}"
      unexpected_algorithms: Jeton bénéficiaire chiffré en %{announced}, attendu %{expected}.
  jobs:
    expire_exchanges_job:
      failed: "Expiration impossible pour l'échange %{id} : %{error}"
  lib:
    audit_trail:
      unreadable_field: "Champ « %{field} » illisible, absent de la ligne de journal : %{error}"
      unhandled_action: "Aucun traitement pour l'action ebMS « %{action} »"
    public_key_set:
      unknown_key_type: "Type de clé inconnu : « %{type} »."
    settings:
      missing: "Variables d'environnement obligatoires absentes ou vides : %{names}."
      not_whole: "Variables d'environnement devant être des nombres entiers positifs : %{names}."
      not_whole_entry: "%{name} (« %{value} »)"
      required: La variable d'environnement %{name} est obligatoire et ne peut pas être vide.
      retention_below_floor: "DUREE_RETENTION_JOURNAL_MOIS vaut %{months} : l'article 17(4) du règlement d'exécution (UE) 2022/1463 impose d'en conserver %{floor} au minimum."
      timeouts_out_of_order: "DELAI_EXPIRATION_REQUETEUR_MINUTES vaut %{requester} et DELAI_EXPIRATION_FOURNISSEUR_MINUTES %{provider} : le chapitre 4.4 des TDD impose que le délai d'attente d'une réponse dépasse celui qu'on s'accorde pour en produire une, transport compris."
  parsers:
    # Dits par plusieurs lecteurs, d'où leur place au-dessus d'eux.
    not_a_query_response: Le message reçu n'est pas une QueryResponse.
    plugin_unreadable: Réponse du plugin illisible.
    slot_reading:
      in_received_message: "%{description} dans le message reçu."
      missing: Slot « %{name} » absent du message reçu.
      empty: Le slot « %{name} » est vide
      without: Le slot « %{name} » ne porte pas %{path}
    evidence_request:
      not_a_query_request: Le message reçu n'est pas une QueryRequest.
      # Les règles du chapitre 4.6 que la France tranche avant de répondre.
      slot_required: La requête reçue doit porter exactement un slot « %{name} ».
      unexpected_specification: La requête reçue annonce %{announced}, et non %{expected}.
      unnamed_specification: une version sans nom
      evidence_subject_not_alone: >-
        La requête reçue doit décrire soit une personne physique, soit une
        personne morale, et une seule (%{count} déclarée(s)).
      # R-EDM-REQ-S004 : l'identifiant est refusé à la lecture, faute de quoi la
      # France le réémettrait dans une réponse qui enfreindrait R-EDM-RESP-S004
      # ou R-EDM-ERR-S004.
      request_id_not_a_uuid: >-
        L'identifiant de la requête reçue (%{id}) n'est pas un UUID préfixé
        « urn:uuid: ».
      unnamed_request_id: absent
      no_er_agent: Pas d'agent classé ER dans le message reçu.
      no_query: Pas de query:Query dans le message reçu.
      agent_without_id: L'agent classé ER est sans identifiant
      agent_without_scheme: L'agent classé ER est sans schéma d'identifiant
      evidence_type_without_id: Le type de justificatif est sans identifiant
      # R-EDM-REQ-C054 : un identifiant facultatif de la personne morale nomme
      # son schéma ; sans lui, il ne désigne rien.
      legal_identifier_without_scheme: Un identifiant de la personne morale est sans schéma
    evidence_response:
      requester_without_id: L'agent requêteur est sans identifiant
      requester_without_scheme: L'agent requêteur est sans schéma d'identifiant
      # Les règles du chapitre 4.6 qu'une réponse reçue enfreint. Aucune ne
      # refuse quoi que ce soit : elles sont composées dans le `detail` de la
      # ligne `response_received` du journal, et l'échange se règle comme si de
      # rien n'était — voir docs/journal_des_echanges.md.
      slot_required: La réponse reçue doit porter exactement un slot « %{name} ».
      unexpected_specification: La réponse reçue annonce %{announced}, et non %{expected}.
      absent_status: La réponse reçue ne déclare aucun statut.
      unexpected_status: >-
        Le statut de la réponse reçue (%{announced}) n'est ni Success ni Unavailable.
      deferral_without_date: >-
        Une réponse au statut Unavailable doit porter exactement un slot « %{name} ».
      date_without_deferral: Le slot « %{name} » n'a de place que dans une réponse au statut Unavailable.
      absent_request_id: La réponse reçue ne déclare l'identifiant d'aucune requête.
      request_id_not_a_uuid: >-
        L'identifiant de la requête répondue (%{id}) n'est pas un UUID préfixé
        « urn:uuid: ».
      response_id_not_a_uuid: L'identifiant de la réponse (%{id}) n'est pas un UUID.
      issue_date_not_a_date_time: La date d'émission (%{value}) n'est pas une date-heure.
      available_date_not_a_date_time: >-
        La date de mise à disposition (%{value}) n'est pas une date-heure.
      provider_identifier_without_scheme: >-
        L'identifiant « %{id} » du fournisseur ne nomme pas son schéma.
      no_object_list: La réponse reçue ne porte pas de rim:RegistryObjectList.
      no_single_ep_agent: Le slot « EvidenceProvider » doit porter exactement un agent classé EP.
      exception_in_a_success: Une réponse en succès ne peut pas porter de rs:Exception.
      unexpected_child: L'élément « %{name} » n'a pas sa place dans une réponse.
      # Ce que la phrase met à la place d'une valeur absente, accordé avec ce
      # qu'elle nomme.
      absent_specification: une version sans nom
      absent_value: absent
      absent_date: absente
    requirements_response:
      requirement_without_id: L'annuaire a rendu une exigence sans identifiant.
    error_response:
      no_exception: Pas de rs:Exception dans la réponse d'erreur reçue.
    retrieved_message:
      unreadable_envelope: Enveloppe SOAP illisible.
      unknown_action: "Action ebMS inconnue : « %{action} »."
      unreadable_body: Corps RegRep illisible.
      no_payload: Pas de charge « %{type} » dans le message reçu.
      # La première partie MIME que le chapitre 4.8 fait consigner : l'entête doit
      # en déclarer une, et la charge qu'elle désigne doit être là.
      no_part: Le message reçu ne déclare aucune partie MIME.
      part_without_href: La première partie MIME du message reçu ne désigne aucune charge.
      payload_missing: Charge « %{id} » annoncée mais absente.
    ebms_header:
      no_header: Pas d'entête ebMS dans le message reçu.
      no_sender: Pas d'expéditeur dans l'entête du message reçu.
      timestamp_unreadable: "Horodatage illisible dans l'entête du message reçu : « %{value} »."
    common_services_response:
      not_a_query_response: La réponse de l'annuaire n'est pas une QueryResponse.
      unexpected_version: L'annuaire a répondu en %{announced}, et non en %{expected}.
      unnamed_version: une version sans nom
      refused_without_reason: L'annuaire a refusé sans dire pourquoi.
      refused: "L'annuaire a refusé : %{detail}"
      nothing_readable: >-
        L'annuaire a répondu avec succès, mais rien n'y était lisible
        (%{count} objet(s) dans la réponse).
  models:
    # La règle `R-EDM-*` enfreinte et ce qu'elle dit, composées en une phrase :
    # c'est sous cette forme que le journal la consigne.
    business_rule_violation:
      sentence: "%{rule} : %{description}"
    # Les trois seules valeurs que `R-EDM-REQ-C119` laisse passer : le message
    # nomme celles qui ont été demandées et celles qui existent, faute de quoi
    # la faute de frappe se cherche à la main.
    associated_document:
      unrequestable: >-
        Documents associés inconnus : %{values}. Seuls %{requestable} peuvent être demandés.
    # La raison que `Exchange#expire!` inscrit, et que la console lit sous
    # « Raison de l'échec ».
    exchange:
      expired: Le correspondant n'a pas répondu dans le délai imparti.
    strict_validation:
      invalid: "%{subject} : %{errors}."
      # Le porteur, que l'objet de valeur ne peut pas connaître : une
      # `EbmsIdentity` ne sait pas si elle décrit un requêteur, un fournisseur
      # ou un point d'accès.
      subjects:
        announced_access_point: Le point d'accès annoncé par l'annuaire
        announced_data_service: Le service de données annoncé par l'annuaire
        announced_evidence_type: Le type de justificatif annoncé par l'annuaire
        announced_provider: Le fournisseur annoncé par l'annuaire
        announced_provider_address: L'adresse du fournisseur annoncé par l'annuaire
        announced_provider_identity: L'identité du fournisseur annoncé par l'annuaire
        announced_requirement: L'exigence annoncée par l'annuaire
        final_recipient: Le destinataire final (C4)
        french_provider: Le fournisseur français
        message_sender: L'expéditeur du message reçu
        original_sender: L'émetteur d'origine (C1)
        provider: Le fournisseur
        recipient_access_point: Le point d'accès destinataire (C3)
        request_beneficiary: Le bénéficiaire de la requête reçue
        request_legal_person: La personne morale sujet de la requête reçue
        requester: Le requêteur
        token_beneficiary: Le bénéficiaire du jeton
    directories:
      common_services:
        no_evidence_type: Aucun type de justificatif pour la démarche « %{procedure} » dans le pays « %{country} »
        no_provider: Aucun fournisseur pour le type de justificatif « %{evidence_type} » dans le pays « %{country} »
        unknown_procedure: Code de démarche « %{procedure} » introuvable
      evidence_requesters:
        unknown: Le requêteur avec comme identifiant « %{id} » est inexistant.
    country_wording:
      by: par %{country}
      # Chaque morceau porte son espace ou sa virgule d'attache : la phrase
      # entière se relit ici, jamais dans le code qui l'assemble.
      declaration: Démarche déclarée%{under} %{by}%{requiring}
      # Un pays déclare volontiers plusieurs fois la même exigence, sous des
      # intitulés différents.
      under:
        one: " sous l'intitulé %{labels}"
        other: " sous les intitulés %{labels}"
      requiring:
        # « avec aucune exigence » n'est pas une phrase qu'on écrit.
        none: ", sans exigence publiée"
        some: ", avec %{requirements}"
  evidence_requests:
    unknown: Cette demande est inconnue.
    beneficiary_required: Le bénéficiaire doit être renseigné
    conversation_invalid: L'identifiant de conversation doit être un UUID
  interactors:
    # Les dix échecs que `fail_with_error` nomme, et qu'`ApplicationInteractor`
    # énumère. La console les affiche en titre d'alerte ; le contrôleur JSON, lui,
    # ne rend que les `errors` qui les accompagnent.
    failures:
      common_services_refused: L'annuaire a refusé
      gateway_refused: La passerelle a refusé le message
      invalid_configuration: Cette installation ne peut pas construire le message
      invalid_directory_entry: L'annuaire a publié une entrée qu'un message ne peut pas porter
      invalid_token: Jeton bénéficiaire invalide
      no_evidence_type: Aucun type de justificatif dans ce pays
      no_provider: Aucun fournisseur dans ce pays
      unknown_country: Pays inconnu des annuaires
      unknown_procedure: Démarche inconnue des annuaires
      unknown_requester: Requêteur inconnu
    evidence_provision:
      answer_request:
        unknown_exchange: "Échange inconnu au moment de répondre : %{id}"
        # Le rejeu d'un identifiant de requête, que le chapitre 4.4 impose de
        # refuser, et la version que l'entête annonce sans que le corps la
        # confirme.
        request_replayed: "Identifiant de requête déjà traité : %{id}"
        unexpected_version: L'entête du message reçu annonce %{announced}, et non %{expected}.
        unnamed_version: une version sans nom
        # Un refus qui ne part pas au correspondant : la réponse réutiliserait
        # l'identifiant qu'on lui reproche. La règle est nommée pour le journal,
        # qui est alors le seul endroit où la décision se relit.
        malformed_identifier: >-
          L'identifiant %{element} « %{value} » n'est pas un UUID, que %{rule} exige : aucune réponse
          ne peut être signée sur cet échange.
    evidence_request:
      send_to_gateway:
        # La panne est nommée comme locale : aucune des huit exceptions du
        # chapitre 4.5.3 ne décrit un émetteur incapable de construire son
        # propre message, et l'échange ne porte donc aucun code EDM. La
        # description est le seul endroit qui dit à qui la panne appartient.
        invalid_configuration: "La configuration de cette installation ne permet pas de construire la requête : %{error}"
    incoming_message:
      open_exchange:
        unidentified: L'entête ne porte pas les deux identifiants de corrélation exigés.
      settle_exchange:
        unknown: "Échange inconnu : %{id}"
        already_settled: "Réponse ignorée, l'échange %{id} est déjà réglé"
        already_delivering: "Réponse ignorée, un autre traitement remet déjà le justificatif de l'échange %{id}"
        foreign_request: "Réponse ignorée, elle ne porte pas l'identifiant de requête de l'échange %{id}"
      process:
        exchange_failed: L'échange a échoué
        exchange_impossible: Échange impossible à mener à son terme
        unreadable: Message illisible
        unreadable_logged: "Message illisible (%{id}) : %{error}"
        unknown_action: "Action ebMS inconnue : « %{action} »."
        abandoned: "%{reason} : %{error}"
  admin:
    # Le même message pour toutes les listes de l'espace : c'est le filtre qui
    # dit lequel de ses critères est en cause, jamais le titre de l'alerte.
    unreadable: Certains critères n'ont pas pu être lus
    # Le pays à qui le justificatif est demandé : le correspondant quand la
    # France requête, la France quand on l'interroge. La démarche, elle,
    # appartient au pays qui requête — les deux ne coïncident jamais.
    #
    # Hors de tout bloc `attributes` : la fiche d'un événement parcourt ce
    # sous-arbre-là et appelle chaque clé sur l'enregistrement, où celle-ci ne
    # répondrait pas.
    solicited_country: Pays sollicité
    filtre:
      # Le format attendu se dit dans l'étiquette, où il fait partie du nom
      # accessible du champ : un `placeholder` disparaît à la première frappe et
      # n'est pas restitué de façon fiable.
      country_hint: Code à deux lettres, par exemple FI
    journal:
      # Hors de `attributes`, que la fiche parcourt en appelant chaque clé sur
      # l'enregistrement : le numéro y ferait une ligne répétant le titre.
      number: Événement
