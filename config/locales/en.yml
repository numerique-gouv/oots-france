            date_of_birth:
              format: must be an ISO 8601 date (YYYY-MM-DD)
          unreadable: is unreadable
          both_identities: >-
            A search concerns either a natural person or a legal person,
            never both at once
        demo/user_identity:
          attributes:
            birthdate:
              format: must be an ISO 8601 date (YYYY-MM-DD)
            eidas_identifier:
              format: must have the form COUNTRY/COUNTRY/IDENTIFIER
            level_of_assurance:
