# What continuous integration checks of `fr.yml`: that no key the code asks for
# is missing from it, and that no key it carries is asked for by nobody.
#
# > [!IMPORTANT]
# > Never run `i18n-tasks normalize`, nor `health` which chains it: it rewrites
# > the YAML through Psych and takes the comments with it, and those say here
# > why each key exists. Nothing stops it technically — the `data.write` default
# > already targets this file — it is an instruction, not a lock.

base_locale: fr
# The application has one audience, and the English vocabulary of the TDD lives
# in the code rather than in a locale.
locales: [fr]

data:
  read:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/
  exclude:
    - app/assets
    # XML templates of the OOTS messages: not one French word to look for.
    - app/templates
  # `Rails/I18nLazyLookup` is off: every key is absolute.
  relative_roots: []

ignore_unused:
  # Rails looks these keys up itself, from the model and the attribute: no
  # `t()` names them.
  - activerecord.*
  - activemodel.*
  # Composed at run time. One line per set, rather than a
  # `search.strict: false` that would bless whole subtrees in silence.
  - admin.journal.conversations.statuses.*
  - admin.sessions.{refused,signed_out,connection_required}
  - components.directory_query.identifiers.*
  - interactors.failures.*
  - interactors.incoming_message.process.{exchange_failed,exchange_impossible,unreadable}
  - interactors.incoming_message.settle_conversation.{already_settled,already_delivering,foreign_request}
  - models.strict_validation.subjects.*
  # The refusals `translating` receives as a key, and composes only once a
  # directory has refused.
  - models.directories.common_services.{no_evidence_type,no_provider}
  # The descriptions `require_content` receives as a key, and composes with
  # `parsers.slot_reading.in_received_message`.
  - parsers.slot_reading.{empty,without}
  - parsers.evidence_request.{agent_without_id,agent_without_scheme,evidence_type_without_id}
  # The rules `validate!` names, each composed from the identifier that failed.
  - parsers.evidence_request.{slot_required,unexpected_specification,evidence_subject_not_alone}
  - parsers.evidence_response.{requester_without_id,requester_without_scheme}
  - admin.common_services.procedures.no_label
  # An event's detail page translates the whole subtree — `t('admin.journal.attributes')`
  # — to walk the columns in the order they are declared there. The scanner then
  # sees a leaf key and loses sight of its children, including the ones the table
  # headings name one by one.
  - admin.journal.attributes.*
