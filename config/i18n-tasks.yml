# What continuous integration checks of `fr.yml`: that no key the code asks for
# is missing from it, and that no key it carries is asked for by nobody.
#
# > [!IMPORTANT]
# > Never run `i18n-tasks normalize`, nor `health` which chains it: it rewrites
# > the YAML through Psych and takes the comments with it, and those say here
# > why each key exists. Nothing stops it technically — the `data.write` default
# > already targets this file — it is an instruction, not a lock.

base_locale: fr
# The application has one audience, and the English vocabulary of the TDD lives
# in the code rather than in a locale.
locales: [fr]

data:
  read:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/
  exclude:
    - app/assets
    # XML templates of the OOTS messages: not one French word to look for.
    - app/templates
  # `Rails/I18nLazyLookup` is off: every key is absolute.
  relative_roots: []

ignore_unused:
  # Rails composes these keys itself, from the model and the attribute: no
  # `t()` names them, and no scanner can see them, so they are exempted here
  # rather than found. Named leaf by leaf and not globbed on `activemodel.*`,
  # for the reason the rest of this list gives: a glob exempts whatever its
  # subtree comes to hold, where a named leaf costs the same line to maintain
  # and makes a departure visible — the model goes, its line goes, and
  # `unused` reports what `fr.yml` still carries under its name.
  - activerecord.attributes.exchange.{exchange_id,conversation_id,preview_location}
  - activerecord.errors.models.exchange.attributes.{exchange_id,conversation_id,preview_location}.format
  - activemodel.attributes.address.country
  - activemodel.attributes.ebms_identity.{id,type_id}
  - activemodel.attributes.access_point.{id,type_id}
  - activemodel.attributes.natural_person.{family_name,given_name,date_of_birth}
  - activemodel.attributes.legal_person.{legal_name,eidas_identifier}
  - activemodel.attributes.evidence_type.{id,distribution_format}
  - activemodel.attributes.requirement.id
  - activemodel.attributes.data_service.{id,evidence_type_classification,distribution_format,distribution_language,distribution_conforms_to}
  - activemodel.attributes.evidence_requester.id
  - activemodel.attributes.evidence_provider.access_point
  - activemodel.attributes.resolution_filter.{procedure_code,country_code,requirement_id,evidence_type_id}
  - activemodel.attributes.audit_event_filter.{event_type,exchange_id,conversation_id,country_code,evidence_requester_id,procedure_code,depuis,jusqu_a}
  - activemodel.attributes.subject_search.{family_name,given_name,date_of_birth,legal_person_identifier}
  - activemodel.errors.models.address.attributes.country.format
  - activemodel.errors.models.natural_person.attributes.date_of_birth.format
  - activemodel.errors.models.legal_person.{attributes.eidas_identifier.format,unpublished_identifier_scheme,valueless_identifier}
  - activemodel.errors.models.requirement.{attributes.id.format,unlabelled_wording}
  - activemodel.errors.models.data_service.attributes.{id,evidence_type_classification,distribution_language,distribution_conforms_to}.format
  - activemodel.errors.models.data_service.unlabelled_wording
  - activemodel.errors.models.resolution_filter.{attributes.country_code.format,unreadable}
  - activemodel.errors.models.audit_event_filter.attributes.{event_type.inclusion,country_code.format,jusqu_a.before_start}
  - activemodel.errors.models.audit_event_filter.unreadable
  - activemodel.errors.models.subject_search.{attributes.date_of_birth.format,unreadable,both_identities}
  # Composed at run time. One line per set, rather than a
  # `search.strict: false` that would bless whole subtrees in silence.
  - admin.journal.exchanges.statuses.*
  - admin.sessions.{refused,signed_out,connection_required}
  - components.directory_query.identifiers.*
  # Looked up by a key composed of the field name read off the subject, falling
  # back on that name when no wording translates it.
  - components.evidence_subject.fields.*
  - interactors.failures.*
  - interactors.incoming_message.process.{exchange_failed,exchange_impossible,unreadable}
  - interactors.incoming_message.settle_exchange.{already_settled,already_delivering,foreign_request}
  - models.strict_validation.subjects.*
  # The refusals `translating` receives as a key, and composes only once a
  # directory has refused.
  - models.directories.common_services.{no_evidence_type,no_provider}
  # The descriptions `require_content` receives as a key, and composes with
  # `parsers.slot_reading.in_received_message`.
  - parsers.slot_reading.{empty,without}
  - parsers.evidence_request.{agent_without_id,agent_without_scheme,evidence_type_without_id}
  - parsers.evidence_request.legal_identifier_without_scheme
  # The rules the parser names, each composed from the identifier that failed —
  # the first three from `validate!`, the last from `request_id`, which refuses
  # at the read rather than in a pass of its own.
  - parsers.evidence_request.{slot_required,unexpected_specification,evidence_subject_not_alone}
  - parsers.evidence_request.request_id_not_a_uuid
  - parsers.evidence_response.{requester_without_id,requester_without_scheme}
  - admin.common_services.procedures.no_label
  # An event's detail page translates the whole subtree — `t('admin.journal.attributes')`
  # — to walk the columns in the order they are declared there. The scanner then
  # sees a leaf key and loses sight of its children, including the ones the table
  # headings name one by one.
  - admin.journal.attributes.*
  # Composées de l'identité que le formulaire soumis a cherchée : la légende du
  # tableau des résultats et le message qui la remplace quand il n'y a rien à
  # montrer la nomment tous les deux, là où le titre de la page dit « personne »
  # pour les deux formulaires. Feuille par feuille, comme le reste de cette liste.
  - admin.journal.subjects.show.{caption,empty}.{person,organisation}
