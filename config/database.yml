# Configuration comes from the environment alone, as everywhere else in this
# repository: no configuration file to keep in step, and the same variables hold
# locally, in the Docker compose stack and in continuous integration. The
# defaults describe the `postgres` service of `docker-compose.yml`.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  host: <%= ENV.fetch('HOTE_BASE_DE_DONNEES', 'localhost') %>
  port: <%= ENV.fetch('PORT_BASE_DE_DONNEES', 5432) %>
  username: <%= ENV.fetch('UTILISATEUR_BASE_DE_DONNEES', 'oots_france') %>
  password: <%= ENV.fetch('MOT_DE_PASSE_BASE_DE_DONNEES', 'oots_france') %>

development:
  <<: *default
  database: <%= ENV.fetch('NOM_BASE_DE_DONNEES', 'oots_france_development') %>

test:
  <<: *default
  database: <%= ENV.fetch('NOM_BASE_DE_DONNEES', 'oots_france') %>_test

production:
  <<: *default
  database: <%= ENV.fetch('NOM_BASE_DE_DONNEES', 'oots_france_production') %>
