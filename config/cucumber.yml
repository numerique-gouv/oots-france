<%
# The end-to-end scenarios cross a real gateway: they cannot run on a bare
# runner, and are therefore kept out of the default profile. `bout_en_bout` is
# the profile `make e2e` invokes.
commun = "--publish-quiet --strict"
%>
default: <%= commun %> --format <%= ENV['CUCUMBER_FORMAT'] || 'pretty' %> --tags 'not @wip and not @bout_en_bout' features
bout_en_bout: <%= commun %> --format <%= ENV['CUCUMBER_FORMAT'] || 'pretty' %> --tags '@bout_en_bout' features
