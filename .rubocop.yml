plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rspec_rails

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  Exclude:
    - "Gemfile"
    - "Rakefile"
    - "bin/**/*"
    - "db/**/*"
    - "config/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - ".worktrees/**/*"
    # Written by the `cucumber-rails` generator and rewritten at every version
    # bump: correcting it would only mean correcting it again afterwards. Its
    # tasks deliberately do not load the Rails environment, which
    # `Rails/RakeEnvironment` cannot know.
    - "lib/tasks/cucumber.rake"

FactoryBot/FactoryAssociationWithStrategy:
  Enabled: false

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/EmptyLineBetweenDefs:
  AllowAdjacentOneLineDefs: true

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/LineLength:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space

Lint/AmbiguousBlockAssociation:
  Exclude:
    - "spec/**/*_spec.rb"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

Lint/EmptyClass:
  Exclude:
    - "app/policies/application_policy.rb"

Lint/InheritException:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Lint/SuppressedException:
  Exclude:
    - "spec/**/*_spec.rb"

Lint/UnexpectedBlockArity:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/spec_helper.rb"
    - "spec/support/shared_examples/*"
    - "spec/factories/**/*"
  AllowedMethods:
    - "describe"
    - "context"
    - "namespace"
    - "shared_examples"
    - "let"
    - "path"
    - "get"
    - "response"
    - "included"

Metrics/ClassLength:
  Max: 150
  CountAsOne:
    - "array"
    - "method_call"

# The same budget, for the modules that are types rather than namespaces:
# `Settings` is a module for the reason a singleton is one, and what makes it
# long is a list of environment variable names and a one-line reader each — the
# very shape `CountAsOne: array` exists to stop counting twice.
Metrics/ModuleLength:
  Max: 150
  CountAsOne:
    - "array"
    - "method_call"

Metrics/MethodLength:
  Max: 15
  CountAsOne:
    - hash
    - array

# The defect this cop prevents — positional arguments one ends up confusing —
# does not exist with keywords, named at the call site as at the definition. And
# an ebMS header really does have a dozen independent fields, each required by
# the specification: grouping them into an object would only move the list.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The step definitions use the French Gherkin keywords Cucumber exposes —
# `Étantdonné`, `Alors` — and the scenarios are French by explicit decision:
# these are not identifiers we choose.
Naming/AsciiIdentifiers:
  Exclude:
    - "features/**/*"

Naming/MethodParameterName:
  AllowedNames:
    - "_"
    - "id"
    - "to"

Naming/PredicateMethod:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

# Comments are English, but they quote what humans read — a French wording from
# `fr.yml`, a country name from a code list: accented characters are normal
# here.
Style/AsciiComments:
  Enabled: false

Style/BlockComments:
  Exclude:
    - "spec/spec_helper.rb"

Style/BlockDelimiters:
  EnforcedStyle: braces_for_chaining

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/MethodCalledOnDoEndBlock:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

Style/MixinUsage:
  Exclude:
    - "features/support/**/*.rb"

Style/OpenStructUse:
  Exclude:
    - "spec/**/*_spec.rb"

Style/SignalException:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Rails/ActionOrder:
  Enabled: false

Rails/Exit:
  Exclude:
    - "spec/**/*"

Rails/FindEach:
  Enabled: false

Rails/I18nLazyLookup:
  Enabled: false

Rails/OutputSafety:
  Enabled: false

Rails/RedundantActiveRecordAllMethod:
  Exclude:
    - "spec/**/*"

# Claiming a delivery is precisely a write that must bypass the read-validate-
# write cycle: that is what makes it atomic.
Rails/SkipsModelValidations:
  Exclude:
    - "app/models/exchange.rb"
    - "spec/**/*_spec.rb"

Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test

RSpec/BeforeAfterAll:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/DescribedClass:
  SkipBlocks: true

RSpec/EmptyExampleGroup:
  Exclude:
    - "spec/requests/**/*"

RSpec/ExampleLength:
  Enabled: false

RSpec/ExampleWording:
  Enabled: false

RSpec/LeakyConstantDeclaration:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/MissingExampleGroupArgument:
  Exclude:
    - "spec/factories/**/*.rb"

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/RepeatedDescription:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false
