x-domibus: &env-domibus
  env_file:
    - ./.env.domibus

x-oots: &configuration-base
  build:
    context: .
  # One image for `web`, `worker` and `test`: without this explicit name,
  # Compose derives one per service and `docker compose build web` would build
  # only one of the three.
  image: oots-france-app
  env_file:
    - ./.env.oots
  # The gems live in `/usr/local/bundle`, outside the mounted directory: this
  # mount therefore does not mask them, and no named volume is needed.
  volumes:
    - .:/usr/src/app

services:
  test:
    <<: *configuration-base
    command: "sh -c 'bundle exec rubocop && bundle exec rspec'"
    depends_on:
      - postgres

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:mainline-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - web
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  web:
    <<: *configuration-base
    # The PID file lives in the directory mounted from the host: a killed
    # container leaves one behind, and `rails server` then refuses to start,
    # announcing a server already running that no longer exists. Removing it here
    # is safe, only one server running per container.
    #
    # `exec` is not cosmetic: without it, `sh` stays PID 1 and alone receives the
    # SIGTERM from `docker compose stop`, without relaying it. The server is then
    # killed by SIGKILL when the grace period expires, having closed nothing.
    command: "sh -c 'rm -f tmp/pids/server.pid && exec bundle exec rails server -b 0.0.0.0'"
    ports:
      - "${PORT_OOTS_FRANCE}:3000"
    depends_on:
     - domibus
     - postgres

  # The worker runs in a process of its own: that is what makes the state of the
  # conversations have to be shared and persistent.
  worker:
    <<: *configuration-base
    command: "bundle exec good_job start"
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    env_file:
      - ./.env.postgres
    # Published so the suite can run outside the container, with
    # `HOTE_BASE_DE_DONNEES=localhost PORT_BASE_DE_DONNEES=`, followed by the
    # value `.env` gives `PORT_POSTGRES`. The reference one, 5433, differs from
    # 5432 so as not to collide with a PostgreSQL already installed locally.
    ports:
      - "${PORT_POSTGRES}:5432"
    # Mounted on `/var/lib/postgresql` and not on its `data` subdirectory: since
    # version 18 the image stores the data in a subdirectory named after the
    # major version, to allow a `pg_upgrade --link` without crossing a mount
    # boundary. Mounting `data` directly makes start-up fail.
    volumes:
      - postgres_data:/var/lib/postgresql

  domibus:
    image: code.europa.eu:4567/edelivery/docker/domibus-tomcat10:5.2-JEE10
    <<: *env-domibus
    environment:
      - DB_TYPE=MySQL
      - DB_HOST=mysql
      - DB_PORT=3306
      # The image rewrites only these two levels in logback.xml, and leaves
      # eu.domibus at DEBUG. INFO would not be enough: the authentication of each
      # request logs « [SEC-001] Unsecure login is allowed » at that level. What
      # WARN sets aside stays readable in logs/domibus-error.log, whose threshold
      # is precisely WARN.
      #
      # These two variables are read only when ./domibus is created: to change a
      # level on a running stack, edit domibus/logback.xml, which Domibus
      # re-reads every 10 s.
      - LOGGER_LEVEL_EU_DOMIBUS=WARN
      # Setting org.apache.cxf to INFO makes the SOAP envelopes appear.
      - LOGGER_LEVEL_ORG_APACHE_CXF=WARN
      - CHECK_DEFAULT_PASSWD=false
      - KEYSTORE_PASSWD=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
      - TRUSTSTORE_PASSWD=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
      # The image's entrypoint injects SERVER_INIT_PROPERTIES into JAVA_OPTS.
      # It is the only way to fix a property that is not lost the next time the
      # image reinitialises ./domibus.
      - >-
        SERVER_INIT_PROPERTIES=
        -Ddomibus.metrics.slf4j.reporter.enable=false
        -Ddomibus.metrics.monitor.jms.queues=false
        -Ddomibus.metrics.monitor.memory=false
        -Ddomibus.metrics.monitor.gc=false
        -Ddomibus.metrics.monitor.cached.threads=false
        -Ddomibus.security.keystore.type=pkcs12
        -Ddomibus.security.keystore.location=/data/tomcat/conf/domibus/keystores/gateway_keystore.p12
        -Ddomibus.security.profiles.active=true
        -Ddomibus.security.profile.rsa.enabled=true
        -Ddomibus.security.profile.rsa.signature.enabled=true
        -Ddomibus.security.profile.rsa.encryption.enabled=true
        -Ddomibus.security.profile.rsa.key.private.sign.alias=AP_FR_01_rsa_sign
        -Ddomibus.security.profile.rsa.key.private.sign.password=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
        -Ddomibus.security.profile.rsa.key.private.decrypt.alias=AP_FR_01_rsa_decrypt
        -Ddomibus.security.profile.rsa.key.private.decrypt.password=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
    logging:
      driver:
        none
    ports:
      - "${PORT_DOMIBUS}:8080"
    volumes:
      - ./domibus:/data/tomcat/conf/domibus
    depends_on:
      - mysql

  mysql:
    image: code.europa.eu:4567/edelivery/docker/domibus-mysql8:5.2-JEE10
    <<: *env-domibus
    security_opt:
      - seccomp:unconfined
    volumes:
      - shared_db_file_system:/var/lib/mysql

volumes:
  postgres_data:
  shared_db_file_system:
