x-domibus: &env-domibus
  env_file:
    - ./.env.domibus

x-oots: &configuration-base
  build:
    context: .
  env_file:
    - ./.env.oots
  volumes:
    - .:/usr/src/app
    - node_modules:/usr/src/app/node_modules/

services:
  test:
    <<: *configuration-base
    command: "npm run test:watch"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:mainline-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - web
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  web:
    <<: *configuration-base
    command: "node --watch server.js"
    ports:
      - "${PORT_OOTS_FRANCE}:3000"
    depends_on:
      domibus:
        condition: service_started
      # Attendre le démarrage ne suffit pas : l'image joue ses scripts
      # d'initialisation — dont la création du rôle applicatif — après avoir
      # ouvert le port, et l'application se connecterait à une base qui refuse
      # encore son rôle. La condition porte donc sur le `healthcheck`.
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine
    # Même fichier que l'application : la base et son client doivent voir les
    # mêmes identifiants, comme `.env.domibus` est partagé par MySQL et Domibus.
    env_file:
      - ./.env.oots
    volumes:
      # Depuis la 18, l'image veut le montage sur /var/lib/postgresql et range
      # les données dans un sous-répertoire nommé d'après la version majeure,
      # de quoi permettre un `pg_upgrade --link` plus tard. Monter directement
      # /var/lib/postgresql/data, comme le voulaient les versions précédentes,
      # fait refuser le démarrage.
      - donnees_postgres:/var/lib/postgresql
      # Joués une seule fois, à la création du volume : voir le script.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  domibus:
    image: code.europa.eu:4567/edelivery/docker/domibus-tomcat10:5.2-JEE10
    <<: *env-domibus
    environment:
      - DB_TYPE=MySQL
      - DB_HOST=mysql
      - DB_PORT=3306
      # L'image ne réécrit que ces deux niveaux dans logback.xml, et laisse
      # eu.domibus à DEBUG. INFO ne suffirait pas : l'authentification de chaque
      # requête journalise « [SEC-001] Unsecure login is allowed » à ce
      # niveau-là, soit deux lignes par seconde sous le polling de
      # src/ecouteurDomibus.js. Ce que WARN écarte reste consultable dans
      # logs/domibus-error.log, dont le seuil est justement WARN.
      #
      # Ces deux variables ne sont lues qu'à la création de ./domibus : pour
      # changer un niveau sur une pile qui tourne, modifier domibus/logback.xml,
      # que Domibus relit toutes les 10 s.
      - LOGGER_LEVEL_EU_DOMIBUS=WARN
      # Passer org.apache.cxf à INFO fait apparaître les enveloppes SOAP.
      - LOGGER_LEVEL_ORG_APACHE_CXF=WARN
      - CHECK_DEFAULT_PASSWD=false
      - KEYSTORE_PASSWD=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
      - TRUSTSTORE_PASSWD=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
      # L'entrypoint de l'image injecte SERVER_INIT_PROPERTIES dans JAVA_OPTS.
      # C'est le seul moyen de fixer une propriété qui ne soit pas perdue à la
      # prochaine réinitialisation de ./domibus par l'image.
      - >-
        SERVER_INIT_PROPERTIES=
        -Ddomibus.metrics.slf4j.reporter.enable=false
        -Ddomibus.metrics.monitor.jms.queues=false
        -Ddomibus.metrics.monitor.memory=false
        -Ddomibus.metrics.monitor.gc=false
        -Ddomibus.metrics.monitor.cached.threads=false
        -Ddomibus.security.keystore.type=pkcs12
        -Ddomibus.security.keystore.location=/data/tomcat/conf/domibus/keystores/gateway_keystore.p12
        -Ddomibus.security.profiles.active=true
        -Ddomibus.security.profile.rsa.enabled=true
        -Ddomibus.security.profile.rsa.signature.enabled=true
        -Ddomibus.security.profile.rsa.encryption.enabled=true
        -Ddomibus.security.profile.rsa.key.private.sign.alias=blue_gw_rsa_sign
        -Ddomibus.security.profile.rsa.key.private.sign.password=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
        -Ddomibus.security.profile.rsa.key.private.decrypt.alias=blue_gw_rsa_decrypt
        -Ddomibus.security.profile.rsa.key.private.decrypt.password=${MOT_DE_PASSE_MAGASINS:?à renseigner dans .env, cf. .env.template}
    logging:
      driver:
        none
    ports:
      - "${PORT_DOMIBUS}:8080"
    volumes:
      - ./domibus:/data/tomcat/conf/domibus
    depends_on:
      - mysql

  mysql:
    image: code.europa.eu:4567/edelivery/docker/domibus-mysql8:5.2-JEE10
    <<: *env-domibus
    security_opt:
      - seccomp:unconfined
    volumes:
      - shared_db_file_system:/var/lib/mysql

volumes:
  donnees_postgres:
  node_modules:
  shared_db_file_system:
