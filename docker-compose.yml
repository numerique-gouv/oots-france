x-domibus: &env-domibus
  env_file:
    - ./.env.domibus

x-oots: &configuration-base
  build:
    context: .
  # One image for `web`, `worker`, `test` and `fake-france-connect`: without
  # this explicit name, Compose derives one per service and `docker compose
  # build web` would build only one of the four. Compose always interpolates
  # COMPOSE_PROJECT_NAME, the normalised name of the directory, so each
  # worktree builds an image no other one replaces.
  image: oots-france-app-${COMPOSE_PROJECT_NAME}
  # Compose builds the missing image of a service with a `build:` section; left
  # unset, it first tries to pull it from Docker Hub, which never has it.
  pull_policy: never
  env_file:
    - ./.env.oots
  # The key of the development credentials, when whoever starts the stack holds
  # it in their environment rather than in config/credentials/development.key:
  # `env_file` reads a file and relays nothing of the caller's environment. Set
  # only if set, so an absent key stays absent.
  environment:
    - RAILS_MASTER_KEY
  # The gems live in `/usr/local/bundle`, outside the mounted directory: this
  # mount therefore does not mask them, and no named volume is needed.
  volumes:
    - .:/usr/src/app

services:
  test:
    <<: *configuration-base
    command: "sh -c 'bundle exec rubocop && bundle exec rspec'"
    depends_on:
      - postgres

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:mainline-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - web
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  web:
    <<: *configuration-base
    # The PID file lives in the directory mounted from the host: a killed
    # container leaves one behind, and `rails server` then refuses to start,
    # announcing a server already running that no longer exists. Removing it here
    # is safe, only one server running per container.
    #
    # `exec` is not cosmetic: without it, `sh` stays PID 1 and alone receives the
    # SIGTERM from `docker compose stop`, without relaying it. The server is then
    # killed by SIGKILL when the grace period expires, having closed nothing.
    #
    # `bin/database_role` is sourced, not run: it substitutes the restricted
    # application role for the owner in this process's environment, which a child
    # could not do. `web` and `worker` are the only two services to source it.
    #
    # The server listens on the very port the host publishes, and not on 3000
    # behind a mapping: `URL_OOTS_FRANCE` has two audiences on a local stack —
    # the browser, which follows the `redirect_uri` FranceConnect+ hands it, and
    # this container, which calls its own contract — and a single `localhost:…`
    # only serves both when the two ports are one. A deployment that leaves the
    # variable at 3000 sees no difference; any other value is the port `nginx`
    # must proxy to.
    command: "sh -c 'rm -f tmp/pids/server.pid && . ./bin/database_role && exec bundle exec rails server -b 0.0.0.0 -p ${PORT_OOTS_FRANCE}'"
    ports:
      - "${PORT_OOTS_FRANCE}:${PORT_OOTS_FRANCE}"
      # The fake FranceConnect+ answers here — it borrows this container's
      # network namespace, and a service that borrows one may publish no port of
      # its own. Nothing listens behind it where the fake does not run.
      - "${PORT_FAUX_FRANCE_CONNECT}:${PORT_FAUX_FRANCE_CONNECT}"
    depends_on:
     - domibus
     - postgres

  # FranceConnect+, the eIDAS bridge and a member state's node, as the
  # demonstration procedure sees them: the fake the end-to-end suite plays,
  # started with the local stack so that a human gets the identity provider the
  # scenarios get. `features/support/fake_france_connect/`, and nothing of it in
  # `app/`.
  #
  # It shares `web`'s network namespace, and that is what makes its issuer a
  # single address. A browser on the host resolves no name of the docker
  # network, so the issuer has to read `http://localhost:<port>`; and `web`, who
  # fetches the discovery document, the token and the JWKS, has to reach that
  # same address. An OpenID Connect client compares the `iss` of the ID Token to
  # the issuer it discovered and refuses two names for one provider.
  #
  # A deployment starts `nginx`, which pulls `web`; the dependency runs the
  # other way, and no container of the fake starts there.
  fake-france-connect:
    <<: *configuration-base
    command: "bundle exec ruby features/support/fake_france_connect/server.rb"
    # The port it binds, which `.env.oots` does not carry — `.env` does, and
    # Compose reads that one to interpolate this file, never to populate a
    # container. Its issuer says where it answers from outside, which a front
    # terminating TLS makes a different address entirely; this says where to
    # knock on the docker network.
    environment:
      PORT_FAUX_FRANCE_CONNECT: ${PORT_FAUX_FRANCE_CONNECT}
    network_mode: "service:web"
    depends_on:
      - web

  # The worker runs in a process of its own: that is what makes the state of the
  # conversations have to be shared and persistent.
  worker:
    <<: *configuration-base
    command: "sh -c '. ./bin/database_role && exec bundle exec good_job start'"
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    env_file:
      - ./.env.postgres
    # Published so the suite can run outside the container, with
    # `HOTE_BASE_DE_DONNEES=localhost PORT_BASE_DE_DONNEES=`, followed by the
    # value `.env` gives `PORT_POSTGRES`. The reference one, 5433, differs from
    # 5432 so as not to collide with a PostgreSQL already installed locally.
    ports:
      - "${PORT_POSTGRES}:5432"
    # Mounted on `/var/lib/postgresql` and not on its `data` subdirectory: since
    # version 18 the image stores the data in a subdirectory named after the
    # major version, to allow a `pg_upgrade --link` without crossing a mount
    # boundary. Mounting `data` directly makes start-up fail.
    volumes:
      - postgres_data:/var/lib/postgresql

  domibus:
    image: code.europa.eu:4567/edelivery/docker/domibus-tomcat10:5.2.2-JEE10
    <<: *env-domibus
    # The image reads its two passwords from files and nowhere else: its
    # entrypoint stops when one is missing. The database one goes by the name the `mysql` image reads it under, rather
    # than this image's default `secret-database`: one secret for both sides.
    secrets:
      - secret-database-mysql
      - secret-activemq
    environment:
      - DB_TYPE=MySQL
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_PASS_FILE=secret-database-mysql
      # The image rewrites only these two levels in logback.xml, and leaves
      # eu.domibus at DEBUG. INFO would not be enough: the authentication of each
      # request logs « [SEC-001] Unsecure login is allowed » at that level. What
      # WARN sets aside stays readable in logs/domibus-error.log, whose threshold
      # is precisely WARN.
      #
      # These two variables are read only when ./domibus is created: to change a
      # level on a running stack, edit domibus/logback.xml, which Domibus
      # re-reads every 10 s.
      - LOGGER_LEVEL_EU_DOMIBUS=WARN
      # Setting org.apache.cxf to INFO makes the SOAP envelopes appear.
      - LOGGER_LEVEL_ORG_APACHE_CXF=WARN
      - CHECK_DEFAULT_PASSWD=false
      - KEYSTORE_PASSWD=${MOT_DE_PASSE_KEYSTORE_TRUSTSTORE:?à renseigner dans .env, cf. .env.template}
      - TRUSTSTORE_PASSWD=${MOT_DE_PASSE_KEYSTORE_TRUSTSTORE:?à renseigner dans .env, cf. .env.template}
      # The image's entrypoint injects SERVER_INIT_PROPERTIES into JAVA_OPTS.
      # It is the only way to fix a property that is not lost the next time the
      # image reinitialises ./domibus.
      - >-
        SERVER_INIT_PROPERTIES=
        -Ddomibus.metrics.slf4j.reporter.enable=false
        -Ddomibus.metrics.monitor.jms.queues=false
        -Ddomibus.metrics.monitor.memory=false
        -Ddomibus.metrics.monitor.gc=false
        -Ddomibus.metrics.monitor.cached.threads=false
        -Ddomibus.security.keystore.type=pkcs12
        -Ddomibus.security.keystore.location=/data/tomcat/conf/domibus/keystores/gateway_keystore.p12
        -Ddomibus.security.profiles.active=false
        -Ddomibus.security.signature.keyIdentifier=DirectReference
        -Ddomibus.security.key.private.alias=AP_FR_01
        -Ddomibus.security.key.private.password=${MOT_DE_PASSE_KEYSTORE_TRUSTSTORE:?à renseigner dans .env, cf. .env.template}
    logging:
      driver:
        none
    ports:
      - "${PORT_DOMIBUS}:8080"
    volumes:
      - ./domibus:/data/tomcat/conf/domibus
    depends_on:
      - mysql

  # MySQL 8.4, started with `--lower-case-table-names=1`: a volume another
  # image initialised does not open under it, nor one it opened under MySQL 8.0
  # — docs/deploiement.md, « Mettre à jour », says how a gateway is brought to
  # it.
  #
  # The image sets MYSQL_PASSWORD_FILE and MYSQL_ROOT_PASSWORD_FILE itself, and
  # MySQL's entrypoint refuses a variable alongside its `_FILE`: neither password
  # may reach this container through `.env.domibus`.
  mysql:
    image: code.europa.eu:4567/edelivery/docker/domibus-mysql8:5.2.2-JEE10
    <<: *env-domibus
    secrets:
      - secret-database-mysql
      - secret-database-mysql-root
    security_opt:
      - seccomp:unconfined
    volumes:
      - shared_db_file_system:/var/lib/mysql

# Read from the variables `.env` declares — Compose fills a secret from a file
# or from the environment it interpolates —, so that configuration stays in the
# environment, where `make check-secrets` sees it.
secrets:
  secret-database-mysql:
    environment: MYSQL_PASSWORD
  secret-database-mysql-root:
    environment: MYSQL_ROOT_PASSWORD
  secret-activemq:
    environment: MOT_DE_PASSE_ACTIVEMQ

volumes:
  postgres_data:
  shared_db_file_system:
