server {
    listen 80;
    server_name example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # `web` écoute le port que `PORT_OOTS_FRANCE` porte : le laisser à 3000
        # dans le `.env` du déploiement, ou reporter ici la valeur choisie.
        proxy_pass  http://web:3000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

        # La session de l'application est un cookie, que Rails laisse aller
        # jusqu'à 4 Ko — et le tampon d'entêtes de nginx en fait 4 Ko pour le
        # bloc entier. Les deux limites se croisent dès que la démarche de
        # démonstration a identifié un usager : nginx répond alors 502 en
        # écrivant « upstream sent too big header », sur une page que Rails
        # avait pourtant rendue.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}
