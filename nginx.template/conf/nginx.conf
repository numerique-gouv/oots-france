server {
    listen 80;
    server_name example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # L'en-tête `Cookie` d'un exploitant porte jusqu'à quatre cookies chiffrés,
    # que Rails laisse aller chacun jusqu'à 4 Ko : la session, l'identité que la
    # démarche de démonstration a obtenue de FranceConnect+, son ID Token, et
    # l'ID Token ProConnect. Une ligne d'en-tête doit tenir dans un tampon, que
    # nginx fait de 8 Ko par défaut ; au-delà de celui-ci, il répond 400.
    # https://nginx.org/en/docs/http/ngx_http_core_module.html#large_client_header_buffers
    large_client_header_buffers 4 32k;

    location / {
        # `web` écoute le port que `PORT_OOTS_FRANCE` porte : le laisser à 3000
        # dans le `.env` du déploiement, ou reporter ici la valeur choisie.
        proxy_pass  http://web:3000;
        proxy_set_header    Host                $http_host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

        # Une réponse peut écrire plusieurs cookies chiffrés, que Rails laisse
        # aller chacun jusqu'à 4 Ko — et le tampon d'entêtes de nginx en fait
        # 4 Ko pour le bloc entier. Les deux limites se croisent dès que la
        # démarche de démonstration identifie un usager : nginx répond alors
        # 502 en écrivant « upstream sent too big header », sur une page que
        # Rails avait pourtant rendue.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}
