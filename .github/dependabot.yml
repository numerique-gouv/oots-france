# Dependabot configuration.
#
# Without this file, only security updates are offered, and open pull requests
# stop being rebased once they go stale: some of them aged for months while
# aiming at versions that had themselves become vulnerable in the meantime.
#
# Documentation:
# https://docs.github.com/fr/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      # One pull request per group: bumps of the development dependencies do not
      # have to be reviewed one by one.
      developpement:
        dependency-type: development
      production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris
