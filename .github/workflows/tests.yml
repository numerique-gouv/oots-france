name: Tests unitaires

# Lint puis suite Jest, sur un runner nu : le transport ebMS y est entièrement
# simulé. Le garde-fou sur les échanges réels est le workflow `e2e.yml`.
# Le projet n'a pas d'étape de compilation, les sources sont exécutées telles
# quelles — voir CLAUDE.md.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm test
