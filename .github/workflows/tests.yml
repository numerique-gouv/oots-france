name: Tests unitaires

# Style then the RSpec suite, on a bare runner: the ebMS transport is entirely
# simulated there. The guard rail on real exchanges is the `e2e.yml` workflow,
# and the one on message conformance is `schematron.yml`.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # To keep in step with `.ruby-version` and the `Dockerfile`'s `FROM`.
        ruby-version: ['4.0.6']

    # The suite touches the database: the state of the conversations lives there,
    # and so does GoodJob's queue.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oots_france
          POSTGRES_PASSWORD: oots_france
          POSTGRES_DB: oots_france
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oots_france"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Read when the framework boots, so before `spec/support/` could set
      # anything: they have to come from the process environment, like the
      # database's own. Test values, with no other use.
      CLE_CHIFFREMENT_JOURNAL: journal_cle_de_chiffrement_pour_integration_continue
      CLE_CHIFFREMENT_DETERMINISTE_JOURNAL: journal_cle_deterministe_pour_integration_continue
      SEL_DERIVATION_CLES_JOURNAL: journal_sel_de_derivation_pour_integration_continue
      DUREE_RETENTION_JOURNAL_MOIS: 12
      HOTE_BASE_DE_DONNEES: localhost
      PORT_BASE_DE_DONNEES: 5432
      UTILISATEUR_BASE_DE_DONNEES: oots_france
      MOT_DE_PASSE_BASE_DE_DONNEES: oots_france
      NOM_BASE_DE_DONNEES: oots_france

    steps:
      - uses: actions/checkout@v7

      - name: Installe Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          # Installs the gems and caches them, with no separate step.
          bundler-cache: true

      - name: Prépare la base de test
        run: bundle exec rails db:test:prepare

      - run: bundle exec rubocop

      # Ni `normalize` ni `health` : voir `config/i18n-tasks.yml`.
      - run: bundle exec i18n-tasks missing

      - run: bundle exec i18n-tasks unused

      - run: bundle exec rspec

      # The browser the scenarios tagged `@javascript` are driven by comes from
      # the runner's own image, which ships Google Chrome and Chromium — so
      # nothing is installed here. But `ubuntu-latest` slides from one release
      # to the next, and a future image may ship neither: this step is what
      # then fails, by name, instead of a Cucumber timeout three layers down.
      #
      # The names come from Ferrum itself rather than being copied here: it is
      # the one that has to find the binary, so the one this step prints is the
      # one it resolves. A list written out again is a list that drifts — and a
      # step whose whole purpose is to be true about the browser.
      - name: Vérifie le navigateur des scénarios @javascript
        run: |
          for nom in $(bundle exec ruby -rferrum -e 'puts Ferrum::Browser::Options::Chrome::LINUX_BIN_PATH'); do
            if chemin=$(command -v "$nom"); then
              echo "$nom → $chemin"
              "$chemin" --version
              exit 0
            fi
          done
          echo "::error::Aucun navigateur sur le PATH : l'image du runner ubuntu-latest en livrait un (Google Chrome et Chromium). Si elle a cessé de le faire, installer Chrome ou Chromium dans une étape de ce workflow."
          exit 1

      - run: bundle exec cucumber
