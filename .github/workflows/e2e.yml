name: Test e2e

# The end-to-end test raises the whole stack (MySQL + Domibus + application) and
# plays a real OOTS exchange: it is the only guard rail on the transport, which
# the unit suite simulates entirely. See docs/test_e2e.md.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Two pushes close together would stack two runs of several minutes, the first of
# which already interests nobody: the older one is abandoned. The group keys on
# the branch — `github.head_ref` for a PR, where `github.ref` would be
# `refs/pull/…/merge`, different on every commit and therefore unable to bring
# two successive runs together.
concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Deploying the Domibus webapp takes several minutes.
    timeout-minutes: 30

    # Throwaway secrets: they live in an ephemeral gateway and disappear with the
    # runner. They are carried at job level because two steps must see them
    # identical — preparing the environment, which writes them into .env and
    # .env.oots, and configuring Domibus, which creates the matching account and
    # generates the certificate stores.
    env:
      LOGIN_API_REST: oots_ci
      MOT_DE_PASSE_API_REST: 'Ci-OotsFrance-2026!'
      MOT_DE_PASSE_MAGASINS: test123

    steps:
      - uses: actions/checkout@v7

      # The runner needs Ruby for itself, and not for the application:
      # `prepare_environment.sh` produces the private decryption key with the
      # standard library. The gems live in the `web` image.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: false

      - name: Prépare les fichiers d'environnement
        run: scripts/ci/prepare_environment.sh

      - name: Récupère les images Domibus et MySQL
        # The Commission's registry sometimes cuts the connection during
        # authentication ("connection reset by peer"): we retry, rather than turn
        # a PR red for a reason foreign to the code.
        #
        # The final `exit 1` is necessary: the loop's exit status is the
        # `sleep`'s, and so a success even after three failures.
        run: |
          for tentative in 1 2 3; do
            # `docker compose pull` has no timeout of its own: a connection
            # established then silent would make it wait until the job's own
            # ceiling. Bounding it turns a hang into a failure the loop knows how
            # to retry — five minutes, where the pull takes under one normally.
            timeout 300 docker compose pull mysql domibus && exit 0
            echo "Échec de récupération (tentative $tentative), nouvelle tentative…"
            sleep 15
          done
          exit 1

      - name: Démarre MySQL
        # MySQL starts alone first: the container creates the database on its
        # first run, and Domibus fails if it connects too early.
        #
        # The wait is the one from scripts/setup.sh, and not a local rewrite: both
        # installation paths must behave the same.
        run: |
          docker compose up --detach mysql
          scripts/ci/wait_for_mysql.sh

      - name: Démarre Domibus
        run: docker compose up --detach domibus

      - name: Construit l'image de l'application
        # While Tomcat deploys the webapp, which takes 35 to 45 s: building here
        # fills that dead time, and the wait that follows is shortened by as much.
        #
        # For that the build context must ignore ./domibus, which the container
        # created and opens to itself alone: see the `.dockerignore` comment,
        # whose re-inclusion patterns stay free of wildcards so that BuildKit can
        # prune the branch.
        run: docker compose build web

      - name: Attend que Domibus réponde
        run: scripts/ci/wait_for_domibus.sh

      - name: Configure Domibus (magasins, PMode, Plugin User)
        # The script generates the certificates itself: those shipped with the
        # image are public and shared by every installation. It ends with a test
        # AS4 message, which must come back acknowledged.
        run: scripts/configure_domibus.sh

      - name: Redémarre la passerelle pour appliquer la notification
        # The plugin's switches are set through the API, but not the rules:
        # `wsplugin.push.rules` is marked non-writable and lives only in the
        # plugin's properties file, which `configure_domibus.sh` writes. They take
        # effect only here.
        run: |
          docker compose restart domibus
          scripts/ci/wait_for_domibus.sh

      - name: Démarre PostgreSQL et prépare le schéma
        # The state of the conversations lives there, and so does GoodJob's queue.
        run: |
          docker compose up --detach postgres
          scripts/ci/wait_for_postgres.sh
          docker compose run --rm --no-deps web bundle exec rails db:prepare
          # `db:prepare` loads the seeds only when it creates the database, and
          # the administrator account comes from them: see scripts/setup.sh, with
          # which this sequence of steps must stay in step.
          docker compose run --rm --no-deps web bundle exec rails db:seed

      - name: Démarre l'application et son worker
        run: |
          docker compose up --detach --no-build web worker
          timeout 120 sh -c 'until curl -sf -o /dev/null http://localhost:3000/up; do sleep 2; done'

      - name: Joue le test e2e
        run: make e2e

      - name: Diagnostic Domibus en cas d'échec
        if: failure()
        run: scripts/ci/diagnose_domibus.sh

      - name: Logs Domibus en cas d'échec
        if: failure()
        # `docker compose logs domibus` returns nothing: the service runs with the
        # `none` logging driver.
        #
        # domibus-error.log first: its appender filters at WARN, so it carries
        # Domibus's refusals without a line of noise. catalina.out next, for what
        # belongs to Tomcat or CXF and does not reach that file.
        run: |
          docker compose exec -T domibus tail -n 200 logs/domibus-error.log || true
          docker compose exec -T domibus tail -n 100 logs/catalina.out || true

      - name: Logs de l'application en cas d'échec
        if: failure()
        run: docker compose logs web || true

      - name: Arrête la pile
        if: always()
        run: docker compose down --volumes || true
