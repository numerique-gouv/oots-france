name: Validation Schematron

# Confronts the messages the code produces with the Schematron rules published
# with the TDD. Unlike `e2e.yml`, no gateway is needed: the messages are
# serialised by the builders of `app/builders/`, then validated offline. See the
# README's "Validation des messages" section.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: schematron-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  schematron:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # One source for the validated version: the script receives it as an
      # argument and the cache key carries it, so the two cannot diverge.
      VERSION_TDD: 2.0.1

    steps:
      - uses: actions/checkout@v7

      # The messages are rendered by the repository's builders, through the
      # `oots:messages` task: the application must therefore be able to load.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      # The runner carries a JDK, but which one depends on the image: fixing it
      # stops an image update changing the XSLT engine under our feet.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Saxon, SchXslt and the thirty-odd Schematron files do not change as long
      # as the TDD version does not; nor does their compilation to XSLT, and that
      # is what costs. The cache replays it in seconds.
      - name: Restaure les artefacts de validation
        uses: actions/cache@v6
        with:
          path: .schematron
          key: schematron-${{ env.VERSION_TDD }}

      - name: Valide les messages contre les règles des TDD ${{ env.VERSION_TDD }}
        # The rules are downloaded from code.europa.eu, whose outages have
        # nothing to do with the PR's code: we retry rather than turn it red (the
        # same reason as the image pulls in `e2e.yml`). A violated rule exits 2
        # and is not replayed: it would not heal on a second attempt, and hiding
        # 45 s of waiting behind a settled verdict helps nobody.
        #
        # The final `exit 1` is necessary: the loop's exit status is the
        # `sleep`'s, and so a success even after three failures.
        #
        # `BAVARD` details the optional slots that are absent: on a runner the
        # output is the only trace left to understand a failure.
        env:
          BAVARD: '1'
        run: |
          for tentative in 1 2 3; do
            scripts/validate_schematron.sh "$VERSION_TDD" && exit 0
            code=$?
            if [ "$code" -eq 2 ]; then
              exit 2
            fi
            echo "Échec de préparation (tentative $tentative, code $code), nouvelle tentative…"
            sleep 15
          done
          exit 1

      - name: Publie les messages et les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: messages-et-rapports-svrl
          path: .schematron/${{ env.VERSION_TDD }}/messages/
          if-no-files-found: ignore
